# logicalworks-crates approved dependency edges — the contract for INV-DEP-EDGE-OWNED.
#
# Read by `lgwks_deps`. A crate reaches this file only after the ladder in
# `lgwks-deps tiers` has been climbed and every rung above a dependency was
# rejected for a stated reason. Adding a block here is an approval; the commit
# that adds it is the signature.
#
# ELIMINATE and CONSOLIDATE crates never appear here. They become a module in
# `crates/lgwks-std` instead, which is why `tier` admits only `boundary` and
# `vendor`.
#
# Extracted from Braid's `contract/APPROVED.toml`; only `lgwks_std`-owned
# entries travel with the crates. Braid-owned entries (braid-capability,
# braid-ir, braid-governance, braid-test-support) stay in Braid.

[policy]
# Schema 3 adds every edge's exit mortgage: each `[[approved]]` entry carries
# a required `[approved.retire]` table (`replacement`, `blocker`, `cost`,
# `review`). Schema 2 registers are refused with a typed error naming this
# migration (#788).
schema = 3
enforce = true
repository = "https://github.com/Logical-Works-Inc/logicalworks-crates"
# This repository's own policy. The gate is a published crate that audits
# other repositories too, so none of this is compiled into it: each register
# declares its own, and a register that approves edges without
# `accepted_licenses` is refused rather than judged by someone else's set.
#
# `accepted_licenses`: the SPDX identifiers an inbound dependency may carry —
# the set the approved packages here already declare (Apache-2.0 and MIT are
# also what these crates publish under); Zlib and BSD-3-Clause because Cargo
# needs every identifier in an expression known, ISC because it is the same
# permissive family as MIT (OpenBSD's licence; rustls carries it as one term
# of its `Apache-2.0 OR ISC OR MIT`), and both are permissive. Not
# accepted: GPL/AGPL (reciprocal), MPL-2.0 inbound (file-level copyleft), and
# LicenseRef-* (a text this repository has not read). Widening is a reviewed
# edit to this line.
accepted_licenses = "0BSD, Apache-2.0, Apache-2.0 WITH LLVM-exception, BSD-3-Clause, CC0-1.0, ISC, MIT, Unlicense, Zlib"
# `surfaces`: INV-DEP-1's closed set of workspace members and approval owners.
# `drishti` joined as a member on ADR 0006 R6 (the Director's order to merge it
# with its history): it owns no approval and reaches every third-party crate
# through the `lgwks_deps` storefront.
surfaces = "lgwks_std, lgwks_bot, lgwks_deps, lgwks_ast, lgwks_macros, drishti"
# `frozen_surfaces` / `frozen_tier`: the standalone lgwks_ast's approvals stay
# boundary (INV-DEP-1). Its edge set grows only on the Director's word: the
# `script!` parser moved in on the SL-2 direction of 2026-10-08 (#383), reaching
# `proc-macro2` through the `lgwks_deps` storefront and `proptest` as a dev edge.
frozen_surfaces = "lgwks_ast"
frozen_tier = "boundary"

