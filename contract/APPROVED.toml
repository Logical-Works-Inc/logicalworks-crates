[[approved]]
crate = "ed25519-dalek"
tier = "boundary"
version = "^3"
license = "BSD-3-Clause"
owner = "lgwks_std"
capability = "sign.ed25519"
source = "registry"
allowed_consumers = "lgwks_std"
allowed_kinds = "normal"
uses_default_features = "false"
features = "alloc, zeroize"
reason = "Detached ed25519 seals that verify offline from the public key alone (#316): BLAKE3 gives MACs only under a shared secret, while a sealed run record must verify from the public key with no secret on the verifier; the standard library has no asymmetric primitive. Same crate and version the consumer seals with, so its direct edge deletes on migration. Lean stack: default-features off with alloc and zeroize, so no rand_core enters — key generation reads lgwks_std::random — and the compiled closure is curve25519-dalek plus the RustCrypto signature/sha2/subtle/zeroize leaves; `zeroize` is selected because 3.0 gates `SecretKey`'s `ZeroizeOnDrop` behind it, and the module documents that drop as clearing the seed."
approved_by = "maintainer"
approved_on = "2026-10-07"
review = "https://github.com/Logical-Works-Inc/logicalworks-crates/issues/316"
[approved.retire]
replacement = "lgwks_std::sign"
blocker = "Detached verification needs an lgwks_std signer module the estate has not written yet."
cost = { cold_build_s = 1.35, crates = 15, binary_bytes = 13373104, measured = "2026-11-02", command = "cargo generate-lockfile --manifest-path /private/tmp/probe-ed25519-dalek/Cargo.toml (offline); cargo tree --locked --manifest-path /private/tmp/probe-ed25519-dalek/Cargo.toml -e normal --prefix none (16 distinct incl. probe); cargo build --locked --manifest-path /private/tmp/probe-ed25519-dalek/Cargo.toml (1.35s); rlib bytes summed under /private/tmp/probe-ed25519-dalek/target/debug/deps (13373104 bytes)" }
