# ─────────────────────────────────────────────────────────────────────────────
# ECS substrate (2026-09-20).
#
# One state substrate serves three consumers: `lgwks_bot`'s four-verb actors,
# drishti's incremental derivation, and the GPU framework's demand-driven
# execution. All three need the same three primitives — stable identity,
# per-value change ticks, and a validated execution order — and none of them
# exists in `std` or in `lgwks_std`.
#
# The zero-dependency executor (`lgwks_std::task`) is deliberately
# single-threaded, non-incremental, and has no query engine: it can await a
# bounded set of futures and nothing more. These four are the incremental
# substrate, admitted default-off like every other storefront capability.
# ─────────────────────────────────────────────────────────────────────────────

[[approved]]
crate = "bevy_ecs"
tier = "boundary"
version = "^0.20"
license = "MIT OR Apache-2.0"
owner = "lgwks_deps"
capability = "ecs.world"
source = "registry"
# The substrate is compiled with default features off and only its `std`
# feature on: `default-features = false` keeps `bevy_reflect` out, and `std`
# is the one non-default feature this workspace asks for.
uses_default_features = "false"
features = "std"
allowed_consumers = "lgwks_deps"
allowed_kinds = "normal"
reason = "Archetypal storage, per-component change ticks, and a topologically validated system schedule have no standard-library equivalent. `std` has no query engine, no stable generational identity, and no way to express 'run this when that value changed' without re-deriving it. The 0.19.1 -> 0.20.0 bump re-ran the admission spike (docs/bevy-0.20-spike.md): the deferred-effect loss it was conditioned on is closed upstream and an unordered sync point is now a build refusal, while Changed<T> precision and the slot-count caveat are unchanged."
approved_by = "maintainer"
approved_on = "2026-09-20"
review = "docs/bevy-admission.md"
[approved.retire]
replacement = "lgwks_bot::ecs"
blocker = "Archetypal storage with change ticks and a validated schedule needs an estate substrate the bot does not own yet."
cost = { cold_build_s = 17.34, crates = 47, binary_bytes = 80010368, measured = "2026-11-02", command = "cargo tree --locked -e normal -p lgwks_deps --no-default-features --features bevy-ecs --prefix none (67 distinct, 47 over the 20-crate base); CARGO_TARGET_DIR=/private/tmp/lgwks-retire-bevy-ecs cargo build --locked -p lgwks_deps --no-default-features --features bevy-ecs (26.61s vs 9.27s base); rlib bytes summed under /private/tmp/lgwks-retire-bevy-ecs/debug/deps (123473888 vs 43463520 base)" }
