# The resource register the meta prover reads (`prove` lane, ADR 0091, #1164).
# One entry per catalog kind; the catalog is code in ci_local/prove.rs. Each
# entry names its one owner and three proofs: `closure`, required lanes that
# refuse the kind acquired outside its owner; `model`, Kani harnesses on the
# owner's code that a required `cargo kani` lane runs; `census`, tests that end
# the real code by every path and read the OS table the kind lives in. An empty
# list is a gap, and the lane names it.

[[resource]]
kind = "process"
owner = "lgwks_std::process"
closure = ["lint", "std-first"]
model = []
census = ["the_census_fails_a_program_that_leaves_a_live_process", "sim_lifeline_releases_every_hold_of_a_killed_owner"]

[[resource]]
kind = "mount"
owner = "lgwks_std::process::hold_device"
closure = []
model = ["ledger_a_device_is_detached_exactly_when_its_dead_owner_still_owns_it"]
census = ["sim_shared_volume_detaches_only_when_unheld_and_idle"]

[[resource]]
kind = "lease"
owner = "lgwks_std::process::lifeline::ledger"
closure = []
model = ["ledger_a_torn_last_line_is_never_read_and_a_whole_one_never_dropped", "ledger_a_device_is_detached_exactly_when_its_dead_owner_still_owns_it"]
census = ["sim_ledger_sweep_releases_only_what_dead_owners_held"]

[[resource]]
kind = "temp"
owner = "lgwks_bot::rt::process scratch"
closure = []
model = []
census = ["sim_scratch_leaves_nothing", "the_census_fails_a_program_that_leaves_residue"]

[[resource]]
kind = "descriptor"
owner = ""
closure = []
model = []
census = []

[[resource]]
kind = "heap"
owner = "lgwks_bot::rt"
closure = ["lint"]
model = []
census = ["sim_heap_a_finished_run_returns_to_its_baseline"]

[[resource]]
kind = "thread"
owner = "lgwks_std::task"
closure = ["lint"]
model = []
census = []

[[resource]]
kind = "daemon"
owner = "ram_disk::attach"
closure = []
model = []
census = ["no_log_volume_logs_no_event_after_a_write_burst"]
