# lgwks_std has no feature subsets (Director, 2026-10-13): every module is part
# of it, so the gate builds and runs it whole and keeps no per-feature lane.

# The declared target matrix, executed. Before this lane the only non-native
# build in the gate was the bot's WASI boundary, so `lgwks_std`, `lgwks_ast` and
# `lgwks_deps` were never checked for a target the gate does not run on, and
# `random` refused at compile time on every target but three. The runner checks
# every declared target per crate: the Rust-only surface is required, and each
# crate's default set is recorded with its declared C-toolchain exemption, so an
# exemption cannot become a lid over a real regression. It is Rust rather than
# the shell script it replaced (#276, ADR 0003). (#276)
[[lane]]
id = "target-matrix"
group = "targets"
surfaces = "local ci"
required = true
command = "cargo run --locked -q -p lgwks_deps --bin check-target-matrix -- ${MATRIX_TARGETS:-}"
ci_step = "Check lgwks-std across the declared target matrix"
needs = ["bin:rustup"]

