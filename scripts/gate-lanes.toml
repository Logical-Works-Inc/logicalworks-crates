# `RUSTFLAGS=""` states the flags this target builds with: none. Without it a
# machine's `$CARGO_HOME/config.toml` `[build] rustflags` reach the WASI target,
# which has no rustflags table of its own, and nightly-only `-Z` flags there make
# the pinned stable rustc refuse to start. The environment variable is the only
# setting that replaces config rustflags rather than joining them; an empty
# `[target.wasm32-wasip1] rustflags` table is ignored by cargo. (#195)
[[lane]]
id = "wasi-boundary"
group = "check"
surfaces = "local ci"
required = false
# The CI step adds the target with rustup and then runs exactly this command
# with the defaults on: the bot's default set is `script` — the token-stream
# reader, no grammar — and that is the portable boundary the step builds and the
# T22 row asserts on (ADR 0003). Measured 2026-10-22: 55 s, exit 0.
command = """\
rustup target add wasm32-wasip1 && \
RUSTFLAGS="" cargo check --locked --manifest-path crates/lgwks-bot/Cargo.toml --target wasm32-wasip1 --features rt\
"""
ci_step = "Check lgwks-bot WASI runtime boundary"
needs = ["bin:rustup"]
reason = "needs rustup and the wasm32-wasip1 target; skip by name when either is absent"

[[lane]]
id = "grammar-matrix"
surfaces = "ci"
required = true
command = """\
cargo test --locked -p lgwks_ast --lib --no-default-features && \
cargo test --locked -p lgwks_ast --lib --no-default-features --features parser && \
cargo test --locked -p lgwks_ast --lib && \
for grammar in bash c cpp csharp css dart elixir go haskell hcl html java javascript json kotlin lua md nix php python ruby rust scala solidity swift tsx typescript yaml; do \
  cargo test --locked -p lgwks_ast --lib --no-default-features --features lang-$grammar || exit 1; \
done && \
cargo test --locked -p lgwks_ast --lib --all-features\
"""
ci_step = "Execute the lgwks-ast grammar matrix"
reason = "CI runs it as a bash loop that reports every grammar; local reports the lane as not covered rather than re-deriving the loop"

