# The repository's ruleset requires a check named "Clippy and scan", and the lint
# job is a matrix whose legs report under their own names. This row carries the
# required name and passes only when the matrix's aggregate result, which is
# `success` only if every leg succeeded, says so.
[[lane]]
id = "clippy-verdict"
surfaces = "ci"
required = true
command = "test \"${LEGS}\" = success"
ci_step = "Every clippy leg passed"
reason = "dedicated PR check row whose job name is the ruleset's required Clippy and scan"

# The ruleset also requires "Build and workspace tests". The suites are built
# once per platform into test archives and run from them in Linux and macOS
# shards (the workspace suite, lgwks_bot full and its saturation shard), and
# lgwks_bot at no default features runs in a job of its own; this row carries
# the required name and passes only when the archives, both platforms' shards,
# the evidence job (evidence, doc tests, smoke) and the no-default suite passed
# and, in a later step of the same job, the run's wall was at most 300 s
# (`ci-wall`).
[[lane]]
id = "build-verdict"
surfaces = "ci"
required = true
command = "test \"${BUILD}\" = success && test \"${TAIL}\" = success && test \"${LINUX}\" = success && test \"${MACOS}\" = success && test \"${BOT_NODEFAULT}\" = success"
ci_step = "Every workspace test job passed"
reason = "dedicated PR check row whose job name is the ruleset's required Build and workspace tests"

# The Director, 2026-10-26: CI fails when a run is over 5 minutes, whatever the
# excuse. No GitHub setting bounds a run, so the required row's job, which needs
# every other job, reads the attempt's start from the runs API and fails past
# 300 s. The start is read with GNU `date -d` and, where that is refused, BSD
# `date -j -f`, so the row holds on the hosted Linux runner and on a Mac.
[[lane]]
id = "ci-wall"
surfaces = "ci"
required = true
command = "started=$(gh api \"repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT\" --jq .run_started_at) && epoch=$(date -u -d \"$started\" +%s 2>/dev/null || date -j -u -f %Y-%m-%dT%H:%M:%SZ \"$started\" +%s) && wall=$(( $(date -u +%s) - epoch )) && echo \"run wall ${wall} s since ${started}, limit 300 s\" && test \"$wall\" -le 300"
ci_step = "Run wall is at most 300 seconds"
reason = "a run's wall clock exists only in CI"

