# The gate's lane table: the one definition of what the gate runs and where.
#
# The `ci-local` binary executes the local lanes from here. The `check-gate-parity`
# binary asserts every lane that names a `ci_step` matches the step of that name in
# `.github/workflows/ci.yml`, and that every gate step in ci.yml is claimed by a
# lane. A second hand-copied command list drifts, and the drift is invisible
# because each side still looks green on its own terms — which is exactly the
# claim issue #127 refused.
#
# Fields
#   id        stable lane name. The receipt and the tests refer to it.
#   surfaces  "local", "ci", or "local ci". A lane is evidence only for the
#             surfaces named here: a green local run never covers a `ci` lane,
#             and the receipt lists every lane this surface did not cover.
#   required  false only when the lane cannot apply on every host. An
#             unavailable *required* lane is `blocked` and refuses the gate.
#             An unavailable *optional* lane is `skip`, reported by name and
#             never counted as `pass`.
#   command   the exact shell command. Shared lanes carry the text here and CI
#             runs the same string (or a prefix of it, when the CI step adds
#             diagnostics), so the parity check can compare them.
#   ci_step   the step `name:` in ci.yml that runs this lane. Required for any
#             lane with "ci" in surfaces that runs as a named step.
#   ci_job    the job `name:` in ci.yml for a lane that runs as unnamed `run:`
#             steps of a whole job (the AppCUI matrix).
#   builtin   instead of `command`, the name of a check implemented inside the
#             `ci-local` binary. Used for the scanners that must be unit-tested
#             against fixture trees rather than shelled out. When such a lane
#             runs in CI, the step is
#             `cargo run --locked -p lgwks_deps --bin ci-local -- --lane <id>`.
#   needs     prerequisites checked before the lane runs. A missing one makes a
#             required lane `blocked` rather than silently absent.
#             Recognised: `script:<path>` (must exist and be executable),
#             `bin:<name>` (must be on PATH), `os:<name>`.
#   platforms Host names (`darwin`, `linux`, `win32`) this lane applies to. A host outside
#             the list reports the lane `skip` (out of scope) rather than
#             failing it. Omitted means every host.
#   fast      true when the lane belongs to the `--fast` set.
#   reason    why a lane is optional or platform-bound.
#   group     lanes that build the same feature sets. A multi-lane local run
#             executes groups concurrently, each in its own target directory,
#             and a group's lanes in the order listed here, so later lanes reuse
#             what earlier ones built. A lane with no group builds nothing.
#             CI follows the same idea at job granularity (WORKFLOW.md §12):
#             every CI job shares one machine, so lanes that build one feature
#             set run in one job rather than each compiling it again.

[toolchain]
rust = "1.99.1"

# ── shared: one command, both surfaces ──────────────────────────────────────

[[lane]]
id = "catalog"
surfaces = "local ci"
required = true
fast = true
# The capability register is the surface #732 refused to leave implicit: one row
# per capability, its owner path, its default, and what a hand-rolled copy looks
# like. The check refuses a row whose owner file, feature or module is gone, a
# row missing for an owner the std-first gate can name in a refusal, and a
# `docs/catalog.md` that is not a fresh render of the register.
command = "cargo run --locked -p lgwks_deps --bin catalog -- --check ."
ci_step = "The capability catalog matches the tree"

[[lane]]
id = "doc-governance"
surfaces = "local ci"
required = true
fast = true
# ADRs hold the ISO/IEC/IEEE 42010 fields and PRDs the ISO/IEC/IEEE 29148
# attributes (ADR 0004). The reader refuses the record that omits one, so a
# decision cannot be recorded in a shape no reader can find its rationale in.
command = "cargo run --locked -p lgwks_deps --bin check-docs"
ci_step = "ADRs and PRDs hold their required fields"

[[lane]]
id = "latency-tails"
surfaces = "local ci"
required = true
# The per-call cost of every leaf call in `lgwks_std`, not a sample of them:
# nineteen rows, each bounded at p50 500 ns and p99 1 500 ns, and the entropy row
# on its tail alone because its cost is the kernel's. The example refuses over
# either bound (ADR 0003).
command = "cargo run --release --locked -p lgwks_std --example latency_tails"
ci_step = "The hot calls hold their latency tails"

[[lane]]
id = "lockfile"
surfaces = "local ci"
required = true
fast = true
# The storefront fixtures are separate workspaces with their own lockfiles, and
# every version bump of a workspace crate makes them stale (#175 failed CI on
# exactly that). Checking them here makes the release cut impossible to forget.
command = """\
cargo metadata --locked --format-version 1 >/dev/null && \
for f in crates/lgwks-deps/tests/fixtures/*/Cargo.lock; do if ! cargo metadata --locked --format-version 1 --manifest-path \"${f%.lock}.toml\" >/dev/null; then echo \"stale fixture lockfile $f: run cargo update --workspace --manifest-path ${f%.lock}.toml\" >&2; exit 1; fi; done\
"""
ci_step = "Verify lockfile is up-to-date"

[[lane]]
id = "invariants"
surfaces = "local ci"
required = true
fast = true
builtin = "invariants"
ci_step = "Verify invariant enforcement references resolve"

[[lane]]
id = "deps-register"
group = "workspace"
surfaces = "local ci"
required = true
fast = true
command = "cargo run --locked -p lgwks_deps --bin lgwks-deps -- check ."
ci_step = "Enforce dependency edge ownership"

[[lane]]
id = "std-first"
surfaces = "local ci"
required = true
fast = true
# The audit is the `check-std-first` binary, ported from the Python script it
# replaces because a repository holds Rust and C++ only. Its own tests moved
# with it: they are unit tests of the binary, run by the workspace test lanes,
# so no `--test` flag is needed to keep the audit tested.
command = "cargo run --locked -p lgwks_deps --bin check-std-first"
ci_step = "Audit std-first and lgwks_std-first"

[[lane]]
id = "unwrap-scan"
surfaces = "local ci"
required = true
fast = true
builtin = "unwrap-scan"
ci_step = "Forbid unwrap outside tests"

[[lane]]
id = "compile"
group = "workspace"
surfaces = "local ci"
required = true
fast = true
# `--timings` writes target/cargo-timings/cargo-timing.html, what each unit of
# the build cost; CI uploads it.
command = "cargo test --workspace --all-targets --locked --no-run --timings"
ci_step = "Build all workspace targets"

[[lane]]
id = "format"
surfaces = "local ci"
required = true
fast = true
command = "cargo fmt --all -- --check && cargo fmt --manifest-path bench/async/Cargo.toml --all -- --check"
ci_step = "Check formatting"

[[lane]]
id = "tests"
group = "workspace"
surfaces = "local ci"
required = true
# The storefront consumer builds run in their own lane and CI job: they are
# nested cargo builds that serialize on one target-directory lock, and in the
# Tests job they alone held the step at 441 s of a 513 s job.
# CI runs this as two shards by setting PARTITION=slice:N/2 (nextest deprecates
# `count:` as neither even nor stable); unset, it is the whole suite.
# lgwks_bot's tests are not in this lane: the `tests-bot-full` and
# `tests-bot-nodefault` lanes run them under the feature sets a consumer builds,
# and the `build-verdict` row requires both with this one.
# NEXTEST_BUILD is the cargo selection nextest builds and runs: unset, the whole
# workspace; CI sets it per shard to the packages that shard runs, which the
# `suite-build` lane compiled in the same job.
command = "cargo nextest run ${NEXTEST_BUILD:---workspace --locked} -E 'not binary(storefront_consumers) and not package(lgwks_bot)' ${PARTITION:+--partition $PARTITION}"
ci_step = "Run all workspace tests"

[[lane]]
id = "suite-build"
surfaces = "ci"
required = true
# Each CI shard compiles the suite it runs, in its own job, before the lane that
# runs it (province#9): NEXTEST_BUILD is the suite's cargo selection, the one the
# run lane then builds from. Listing builds every test binary of the selection
# and runs none, so the step's time is the compile alone. Building in the shard
# replaced a build-once archive whose upload, second runner and download put
# 60 to 90 s between the compile and the tests (run 41671270220).
command = "cargo nextest list ${NEXTEST_BUILD} --message-format oneline >/dev/null"
ci_step = "Build the suite"

[[lane]]
id = "simulation-archive"
surfaces = "ci"
required = true
# The first Linux shard of each suite archives the binaries it built, and the
# `simulation-evidence` lane lists those archives (SIMULATION_ARCHIVES) instead
# of compiling every workspace test again. nextest writes into an existing
# directory only (run 41605078279).
command = "mkdir -p nextest-archive && cargo nextest archive ${NEXTEST_BUILD} --archive-file nextest-archive/suite.tar.zst"
ci_step = "Archive the suite for the simulation lane"

[[lane]]
id = "simulation-lane-build"
surfaces = "ci"
required = true
# The simulation job starts with the shards and builds its lane runner while
# they compile, so the runner is ready when their archives land (run
# 41698583571: after the shards, it put 40 s on the run's wall).
command = "cargo build --locked -p lgwks_deps --bin ci-local"
ci_step = "Build the simulation lane"

[[lane]]
id = "simulation-archives-ready"
surfaces = "ci"
required = true
# Waits, bounded at 60 polls, until the first Linux shard of every suite has
# uploaded its archive to this run, and fails naming the suites that never did.
command = '''set -euo pipefail
for attempt in $(seq 1 60); do
  listed="$(curl -fsS --retry 3 -H "Authorization: Bearer ${TOKEN}" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" | tr -d ' \n')"
  missing=""
  for suite in workspace bot-rest bot-it-scale bot-it-surface bot-it-refusals bot-it-g1 bot-it-g2 bot-it-g3 bot-it-g4 bot-it-g5 bot-it-g6 bot-it-g7 bot-it-g8; do
    case "${listed}" in *"\"name\":\"nextest-archive-${suite}-Linux\""*) ;; *) missing="${missing} ${suite}" ;; esac
  done
  if [ -z "${missing}" ]; then echo "every suite archive is uploaded"; exit 0; fi
  echo "attempt ${attempt}: waiting on${missing}"
  sleep 4
done
echo "::error::the suite archives never arrived:${missing}"
exit 1
'''
ci_step = "Wait for the Linux suite archives"

[[lane]]
id = "sqlite3-program"
surfaces = "ci"
required = true
# The receipt tests drive the sqlite3 program, which the trixie container lacks
# (run 41621737724), so it is installed where absent.
command = "command -v sqlite3 >/dev/null || { apt-get -qq update && apt-get -qq install -y sqlite3; }"
ci_step = "Prepare the checkout"

[[lane]]
id = "bot-shard-targets"
surfaces = "ci"
required = true
# lgwks_bot full is built in two parts that name their test targets (bot-it:
# `it`; bot-rest: the rest), so a target added to the crate
# and named in neither would never run. This refuses that drift.
command = '''test "$(cargo metadata --locked --format-version 1 --no-deps | jq -r '[.packages[] | select(.name == "lgwks_bot") | .targets[] | select(.kind == ["test"]) | .name] | sort | join(" ")')" = "ecs_tick it process_job sim_deep_cancel sim_review_path t03_non_yielding"'''
ci_step = "Every lgwks_bot test target is in a bot shard"

[[lane]]
id = "storefront-consumers"
group = "storefront"
surfaces = "local ci"
required = true
command = "cargo nextest run --locked -p lgwks_deps --test storefront_consumers ${PARTITION:+--partition $PARTITION}"
ci_step = "Build storefront consumers"

[[lane]]
id = "simulation-evidence"
group = "workspace"
surfaces = "local ci"
required = true
builtin = "simulation-evidence"
ci_step = "Deterministic simulation evidence"
needs = ["bin:cargo-nextest"]

[[lane]]
id = "tests-bot-nodefault"
group = "bot-nodefault"
surfaces = "local ci"
required = true
# CI runs it whole, beside the lgwks-std per-feature lanes; PARTITION=slice:N/M
# shards it again if that job grows past its budget.
command = "cargo nextest run -p lgwks_bot --all-targets --locked --no-default-features ${PARTITION:+--partition $PARTITION}"
ci_step = "Run lgwks-bot no-default-feature tests"

[[lane]]
id = "tests-std-full-build"
group = "bot-full"
surfaces = "ci"
required = true
# The std-full suite's compile, bounded apart from its tests so a cold cache
# fits the job (ci.yml, run 41563372316). Locally the test lane builds them.
command = "cargo nextest run -p lgwks_std --all-targets --locked --features full --no-run"
ci_step = "Build lgwks-std full-feature tests"

[[lane]]
id = "tests-std-full"
group = "bot-full"
surfaces = "local ci"
required = true
# CI runs it whole, on the first lgwks-bot full shard, which builds the same
# feature set.
command = "cargo nextest run -p lgwks_std --all-targets --locked --features full ${PARTITION:+--partition $PARTITION}"
ci_step = "Run lgwks-std full-feature tests"

[[lane]]
id = "tests-bot-full"
group = "bot-full"
surfaces = "local ci"
required = true
# CI runs this whole in one job: it is bound by the machine-wide churn slots, so a second instance adds no throughput; unset PARTITION is the
# whole suite less the saturation tiers, which `tests-bot-saturation` runs. Left
# in, the three tiers (100, 1,000 and 10,000 concurrent runs) land in one shard:
# on run 37205854158 that shard's test phase took 229 s against 61-63 s for the
# other three, and set the whole run's wall at 481 s. On macOS the `ci` profile
# also leaves out the `sim_review_path` binary, which `tests-bot-saturation` runs
# (`.config/nextest.toml`); on Linux the container run keeps every test.
command = "cargo nextest run ${NEXTEST_BUILD:--p lgwks_bot --all-targets --locked --features full} --profile ci -E 'not test(saturation_r32_tier)' ${PARTITION:+--partition $PARTITION}"
ci_step = "Run lgwks-bot async runner tests"

[[lane]]
id = "acceptance-receipts"
surfaces = "ci"
required = true
# The receipt, built from the JUnit reports the lgwks-bot jobs already wrote (the
# full suite and the saturation legs, one directory each) and the Linux and
# Windows legs' (`acceptance-junit`, one directory per leg). The
# `acceptance-receipts` binary reads the XML and records into SQLite
# through the sqlite3 program, and does not run the suite a second time. The
# binary is built by the workspace evidence job, beside the suites, and handed
# to the required row as an artifact (`receipts-tool/`): that row is the run's
# last link, and on a fresh hosted runner a `cargo run` there compiles the
# lgwks_deps library first. An artifact keeps no file mode, hence the `chmod`.
command = "chmod +x receipts-tool/acceptance-receipts && receipts-tool/acceptance-receipts --from-junit acceptance-artifact/*/junit.xml --db acceptance-artifact/receipts.sqlite --export acceptance-artifact/acceptance-receipts.json --revision \"$REVISION\" --platform darwin-arm64 && receipts-tool/acceptance-receipts --from-junit acceptance-junit/acceptance-junit-linux-*/junit.xml --db acceptance-artifact/receipts.sqlite --export acceptance-artifact/acceptance-receipts-linux.json --revision \"$REVISION\" --platform linux-aarch64 && receipts-tool/acceptance-receipts --map docs/acceptance/t-rows-windows.toml --features process,script,ephemeral --from-junit acceptance-junit/acceptance-junit-windows/junit.xml --db acceptance-artifact/receipts.sqlite --export acceptance-artifact/acceptance-receipts-windows.json --revision \"$REVISION\" --platform windows-x86_64"
ci_step = "Record acceptance receipts"

[[lane]]
id = "tests-linux"
surfaces = "ci"
required = true
# The two §4.7 cells (`lgwks_std --features full` and `lgwks_ast`) for
# `aarch64-unknown-linux-gnu`, built natively on the hosted arm64 Linux runner,
# whose own C compiler targets that triple (province#9). The Linux-only paths
# the container leg used to carry run in the `tests` and `tests-bot-full` lanes'
# Linux shards, in a `rust:<pin>-trixie` job container: its util-linux 2.41
# `setpriv` applies Landlock (#337), which the runner image's older one cannot.
# On a Mac, `linux-container-tests` still runs the same suites in a container.
command = "cargo check --locked -p lgwks_std --features full --target aarch64-unknown-linux-gnu && cargo check --locked -p lgwks_ast --target aarch64-unknown-linux-gnu"
ci_step = "Check the aarch64-unknown-linux-gnu target cells"

[[lane]]
id = "tests-bot-saturation"
group = "bot-full"
surfaces = "local ci"
required = true
# The saturation family on its own, after `tests-bot-full` rather than in it:
# left in, the tiers set one shard's tail. The `sim_review_path` binary's 42
# review-path simulations and lgwks_bot's 164 `sim_scale` tests run here too
# and not in `tests-bot-full` on macOS (`.config/nextest.toml`'s `ci` profile
# filters them out there), so this lane lifts that filter with
# `--ignore-default-filter` and writes the JUnit report the receipt reads.
#
# CI runs it as a step of the bot-full job after that suite, which has built
# every binary it needs, with SATURATION_BINARIES naming both test binaries
# and SATURATION_FILTER both families (two jobs of their own cost the run a
# second job's hop, run 40321492424); unset, it is the whole `sim_review_path`
# binary. The default is taken only when SATURATION_BINARIES is unset (`-`, not
# `:-`): run from an archive, CI sets it empty, because nextest refuses `--test`
# beside `--archive-file` and SATURATION_FILTER already names both binaries.
command = "cargo nextest run ${NEXTEST_BUILD:--p lgwks_bot --locked --features full} --profile ci --ignore-default-filter ${SATURATION_BINARIES---test sim_review_path} -E \"${SATURATION_FILTER:-binary(sim_review_path)}\" ${PARTITION:+--partition $PARTITION}"
ci_step = "Run lgwks-bot saturation tiers"

[[lane]]
id = "tests-bot-darwin-trows"
surfaces = "ci"
required = true
platforms = ["darwin"]
# The `it` and library tests the Darwin receipt names (`docs/acceptance/
# t-rows.toml`), on hosted macOS: one `it` group per job (the `lwc_it_group`
# cfg, set through RUSTFLAGS) under the features the T-row modules gate on,
# with IT_FILTER naming the T-row modules. Unset, it is the whole `it` binary
# and the library's unit tests under `full`. Without these jobs the receipt
# reported 283 named tests not passing (run 41784471298).
command = "cargo nextest run ${NEXTEST_BUILD:--p lgwks_bot --test it --lib --locked --features full} --profile ci -E \"${IT_FILTER:-binary(it) | binary_id(lgwks_bot)}\""
ci_step = "Run lgwks-bot Darwin T-row tests"

[[lane]]
id = "bench-async-fairness"
group = "bot-full"
surfaces = "local ci"
required = true
# The async rig's three gates and its unit tests, not its timings. `--mutant-check`
# is the negative control: the fairness gate must REFUSE a side that stops
# draining, and the lane fails if it ever accepts one. `--tiers` is the same gate
# applied at every concurrency tier the contract names (100, 1k, 10k, 100k), so a
# tier that drifts mid-run is caught at the round it drifted. `--matrix` drives
# every workload row lgwks_bot can drive today and aborts on the first row that
# fails, so a matrix with a skipped row cannot read as coverage. The unit tests
# run first because the rig is its own workspace root: `cargo test --workspace`
# never reaches them, and a regression test no lane runs cannot fail CI. All of
# it is seconds, and all of it runs against the release build in a target
# directory of its own: the rig is a separate workspace root precisely so its
# raw-`tokio` edge is invisible to `lgwks-deps check`.
command = "cargo test --locked --manifest-path bench/async/Cargo.toml --bin lgwks-bench-async && cargo run --release --locked --manifest-path bench/async/Cargo.toml -- --mutant-check && cargo run --release --locked --manifest-path bench/async/Cargo.toml -- --tiers && cargo run --release --locked --manifest-path bench/async/Cargo.toml -- --matrix"
ci_step = "Async fairness gate and concurrency ladder"

[[lane]]
id = "digest-timing"
group = "std-full"
surfaces = "local ci"
required = true
# #275: Welch's t over `Digest` equality, a digest against an equal copy and
# against one differing in its first byte, 250,000 samples per class on the
# release build (down from the harness's 1,000,000 default: the wall is linear
# in samples while t scales with its square root, so the early-exit control
# still reads t in the thousands and a sub-1% leak still reads past the
# threshold). It fails when |t| >= 4.5 (dudect's threshold), and also when
# the early-exit negative control is NOT detected, because a harness that
# cannot see a leak proves nothing. Locally this is aarch64-apple-darwin; the CI
# job is x86_64-unknown-linux-gnu, so the two targets the issue names are both
# measured on every change.
command = "cargo run --release --locked -p lgwks_std --features hash --example digest_timing -- --samples 250000"
ci_step = "Digest constant-time equality (dudect)"

# INV-STD-UNSAFE-1: the Miri proof of the two `unsafe` modules, as a lane rather
# than a paragraph. `cargo miri test` and not `cargo miri nextest run`: Miri
# cannot be wrapped and `.config/nextest.toml` wraps every test on macOS in
# `churn-slot`, so nextest handed the wrapper to the interpreter as a double
# spawn and the run failed with exit 70 before a test started; Miri also
# recompiles the test crate once per test, and all seventeen of these tests live
# in one lib binary.
#
# Both halves are cross-interpreted by name, so one host proves both modules:
# `process::darwin::tests` under `--target aarch64-apple-darwin` runs the sysctl
# seam even on a Linux runner, and `process::windows::tests` under
# `--target x86_64-pc-windows-msvc` runs the kernel32 seam. The live-kernel tests
# are already `#[cfg(not(miri))]` in both modules, and the seeded bands already
# shrink under `#[cfg(miri)]`, so no filter is needed here.
#
# The nightly is pinned in this lane, not in `rust-toolchain.toml`: the gate keeps
# one compiler and the proof names its own. `rust-src` is installed up front
# because `cargo miri` otherwise stops to ask before adding it, and a CI step has
# nothing to answer with. `CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER=""` states that
# Miri runs rustc itself (`.cargo/config.toml` wraps every workspace build in
# clippy-driver, and Miri refuses a wrapper), and `-Zmiri-strict-provenance`
# refuses an integer that becomes a pointer without its provenance, which is what
# the Windows stand-in's handles would be if they stopped using
# `without_provenance_mut`.
#
# `--no-default-features --features process` states the one capability the proof
# needs. With the default set on, `hash` pulled `blake3`, whose C/NEON build ran
# the runner's Linux `cc` with `-arch arm64 -mmacosx-version-min=11.0` and failed
# before Miri started (run 39842979620): the proof is about `lgwks_std`'s two
# syscall modules, and no hash is involved in either.
#
# Measured cold in the repository's Linux container: the install 12 s, the darwin
# seam 33 s (7 tests), the Windows seam 30 s (10 tests), 71 s for the lane; 16 s
# on a warm darwin host. The negative control (the fill given a buffer of half
# the length it names) is caught as an out-of-bounds dangling reference at
# darwin/tests.rs:113 through darwin.rs:191.
[[lane]]
id = "miri-unsafe"
surfaces = "local ci"
required = true
command = """\
rustup toolchain install nightly-2026-10-01 --profile minimal --component miri --component rust-src && \
CARGO_BUILD_WARNINGS=warn CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER="" cargo +nightly-2026-10-01 miri setup --target aarch64-apple-darwin && \
CARGO_BUILD_WARNINGS=warn CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER="" cargo +nightly-2026-10-01 miri setup --target x86_64-pc-windows-msvc && \
CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER="" MIRIFLAGS=-Zmiri-strict-provenance cargo +nightly-2026-10-01 miri test -p lgwks_std --no-default-features --features process --locked --lib --target aarch64-apple-darwin process::darwin::tests && \
CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER="" MIRIFLAGS=-Zmiri-strict-provenance cargo +nightly-2026-10-01 miri test -p lgwks_std --no-default-features --features process --locked --lib --target x86_64-pc-windows-msvc process::windows::tests\
"""
ci_step = "Prove the process unsafe seams under Miri"
needs = ["bin:rustup"]

[[lane]]
id = "doc-tests"
group = "workspace"
surfaces = "local ci"
required = true
# nextest does not run doc tests, so this lane stays on cargo test by
# necessity, not by habit.
command = "cargo test --workspace --doc --locked"
ci_step = "Doc tests"

[[lane]]
id = "debug-e2e"
group = "workspace"
surfaces = "local ci"
required = true
builtin = "debug-e2e"
ci_step = "Debug doctor end-to-end journey"

[[lane]]
id = "simulation-evidence-check"
surfaces = "ci"
required = true
# The check row reads the report `simulation-evidence` wrote in the workspace
# job and passes only on that lane's own pass line; rebuilding the workspace to
# list it a second time cost a runner 364 s per run (run 37579691890).
command = "cat gate-evidence/simulation-evidence.txt && grep -q '^<== simulation-evidence: pass' gate-evidence/simulation-evidence.txt"
ci_step = "Check successful simulation result"
reason = "dedicated PR check row whose job name exposes the successful simulation result"

[[lane]]
id = "debug-e2e-check"
surfaces = "ci"
required = true
