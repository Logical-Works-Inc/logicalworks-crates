name: Hosted Rust toolchain and caches
description: >
  Prepares a job on a GitHub-hosted runner (province#9: every job is hosted;
  the repository is public, so a self-hosted runner would execute a fork's
  pull request on the Director's Mac). It pins the toolchain alone, so the
  cache key never rotates on a toolchain the image adds, and sets up the two
  cache layers, each with one owner: Swatinem/rust-cache holds the registry and
  the dependency build, keyed by the lane group the job builds and saved from
  `main` alone; sccache, on the GitHub Actions backend, holds compiled crates,
  workspace crates included, because every hosted job checks out at the same
  path. Tools arrive prebuilt and pinned (taiki-e/install-action), never
  compiled in CI. WORKFLOW.md §12 is the specification.
inputs:
  toolchain:
    description: The toolchain the gate pins (scripts/gate-lanes.toml `[toolchain]`).
    required: true
  cache-key:
    description: >
      The rust-cache shared key: the `group` of scripts/gate-lanes.toml whose
      feature sets this job builds, so jobs that build one group share one
      entry instead of saving a copy each. rust-cache adds the OS, the
      architecture, the toolchain and the lockfile to it.
    required: true
  components:
    description: Extra rustup components, comma-separated.
    required: false
    default: ""
  nextest:
    description: Whether the job runs cargo-nextest.
    required: false
    default: "false"
  caches:
    description: >
      Whether the job compiles. A shard that runs a test archive builds nothing,
      so it skips restoring a dependency build it would never read.
    required: false
    default: "true"
  sccache:
    description: >
      Whether the job reads and writes sccache. A job whose rust-cache entry main
      already saves restores its whole dependency build from that entry, so its
      sccache objects only took room: the repository's 10 GiB held 5.24 GiB of
      them, sccache logged 143 write errors on the macOS bot archive and every
      run compiled it cold (run 41633491192).
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Pin Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
    # rust-cache hashes every installed toolchain, so one the image adds rotates
    # the key and throws the cache away (run 39379487172: image 20261018.339.1
    # added stable beside the pin and the std-full job compiled cold).
    - name: Set up the pinned toolchain alone
      shell: bash
      run: |
        set -euo pipefail
        # The pin is stated three times (rust-toolchain.toml, the lane table's
        # `[toolchain]`, every `toolchain:` of the workflows) and the parity
        # check holds the last two together; this holds the first to them.
        pinned="$(awk -F'"' '/^channel/ { print $2 }' rust-toolchain.toml)"
        if [ "${pinned}" != "${{ inputs.toolchain }}" ]; then
          echo "::error::rust-toolchain.toml pins '${pinned}', the gate pins ${{ inputs.toolchain }}"
          exit 1
        fi
        rustup default "${{ inputs.toolchain }}"
        for installed in $(rustup toolchain list --quiet); do
          case "${installed}" in
            "${{ inputs.toolchain }}"-*) ;;
            *) rustup toolchain uninstall "${installed}" ;;
          esac
        done
    # `.cargo/config.toml` links macOS builds with /opt/homebrew/bin/ld64.lld.
    # The pinned toolchain ships the same linker as `rust-lld`, which takes the
    # Mach-O flavour from the name it is called by, so a link to it stands in
    # for `brew install lld` (27 s of every macOS job, run 41607020833, which
    # cancelled the workspace archive 4 s past its limit).
    - name: Link the toolchain's lld as ld64.lld on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: ln -sf "$(rustc --print sysroot)/lib/rustlib/aarch64-apple-darwin/bin/rust-lld" /opt/homebrew/bin/ld64.lld && /opt/homebrew/bin/ld64.lld --version
    - name: Cache the registry and the dependency build
      if: inputs.caches == 'true'
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.cache-key }}
        # Every ref saving filled the 10 GiB cap and evicted main's entries,
        # so pull requests compiled cold (10.66 GiB on 2026-11-03, main 1.41).
        # Saved from main alone, the cache is one ref's worth and a pull
        # request restores the last merged build. A pull request never saves
        # to warm its own next run: the budget holds on the run that lands
        # cold, so a second run's cache hit proves nothing.
        save-if: ${{ github.ref == 'refs/heads/main' }}
        cache-on-failure: "true"
    - name: Install sccache
      if: inputs.caches == 'true' && inputs.sccache == 'true'
      uses: mozilla-actions/sccache-action@v0.0.11
      with:
        version: v0.18.0
    # sccache cannot cache an incremental compilation, and a hosted target
    # directory never outlives its job, so incremental state is only cost here.
    - name: Set up sccache as the compiler wrapper
      if: inputs.caches == 'true'
      shell: bash
      run: |
        {
          if [ "${{ inputs.sccache }}" = "true" ]; then
            echo "SCCACHE_GHA_ENABLED=true"
            echo "RUSTC_WRAPPER=sccache"
          fi
          echo "CARGO_INCREMENTAL=0"
        } >> "${GITHUB_ENV}"
    - name: Install cargo-nextest
      if: inputs.nextest == 'true'
      uses: taiki-e/install-action@v2
      with:
        tool: nextest@0.9.149
