name: Hosted Rust toolchain and caches
description: >
  Prepares a job on a GitHub-hosted runner (province#9: every job is hosted;
  the repository is public, so a self-hosted runner would execute a fork's
  pull request on the Director's Mac). It pins the toolchain alone, so the
  cache key never rotates on a toolchain the image adds, and sets up the two
  cache layers, each with one owner: Swatinem/rust-cache holds the registry and
  the dependency build, keyed by the lane group the job builds and saved from
  `main` alone; sccache, on the GitHub Actions backend, holds compiled crates,
  workspace crates included, because every hosted job checks out at the same
  path. Tools arrive prebuilt and pinned (taiki-e/install-action), never
  compiled in CI. WORKFLOW.md §12 is the specification.
inputs:
  toolchain:
    description: The toolchain the gate pins (scripts/gate-lanes.toml `[toolchain]`).
    required: true
  cache-key:
    description: >
      The rust-cache shared key: the `group` of scripts/gate-lanes.toml whose
      feature sets this job builds, so jobs that build one group share one
      entry instead of saving a copy each. rust-cache adds the OS, the
      architecture, the toolchain and the lockfile to it.
    required: true
  components:
    description: Extra rustup components, comma-separated.
    required: false
    default: ""
  nextest:
    description: Whether the job runs cargo-nextest.
    required: false
    default: "false"
  caches:
    description: >
      Whether the job compiles. A shard that runs a test archive builds nothing,
      so it skips restoring a dependency build it would never read.
    required: false
    default: "true"
  sccache:
    description: >
      Whether the job reads and writes sccache. A job whose rust-cache entry main
      already saves restores its whole dependency build from that entry, so its
      sccache objects only took room: the repository's 10 GiB held 5.24 GiB of
      them, sccache logged 143 write errors on the macOS bot archive and every
      run compiled it cold (run 41633491192).
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Pin Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
    # rust-cache hashes every installed toolchain, so one the image adds rotates
    # the key and throws the cache away (run 39379487172: image 20261018.339.1
    # added stable beside the pin and the std-full job compiled cold).
    - name: Set up the pinned toolchain alone
      shell: bash
      run: |
        set -euo pipefail
        # The pin is stated three times (rust-toolchain.toml, the lane table's
        # `[toolchain]`, every `toolchain:` of the workflows) and the parity
        # check holds the last two together; this holds the first to them.
        pinned="$(awk -F'"' '/^channel/ { print $2 }' rust-toolchain.toml)"
        if [ "${pinned}" != "${{ inputs.toolchain }}" ]; then
          echo "::error::rust-toolchain.toml pins '${pinned}', the gate pins ${{ inputs.toolchain }}"
          exit 1
        fi
        rustup default "${{ inputs.toolchain }}"
        for installed in $(rustup toolchain list --quiet); do
          case "${installed}" in
            "${{ inputs.toolchain }}"-*) ;;
            *) rustup toolchain uninstall "${installed}" ;;
          esac
        done
    # `.cargo/config.toml` links macOS builds with /opt/homebrew/bin/ld64.lld.
    # The pinned toolchain ships the same linker as `rust-lld`, which takes the
    # Mach-O flavour from the name it is called by, so a link to it stands in
    # for `brew install lld` (27 s of every macOS job, run 41607020833, which
    # cancelled the workspace archive 4 s past its limit).
    - name: Link the toolchain's lld as ld64.lld on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: ln -sf "$(rustc --print sysroot)/lib/rustlib/aarch64-apple-darwin/bin/rust-lld" /opt/homebrew/bin/ld64.lld && /opt/homebrew/bin/ld64.lld --version
    # rust-cache's own key ends in a hash of `.cargo/config.toml` and every
    # member manifest, and on a miss of that hash it restores the nearest entry
    # and then deletes every artifact older than a week (its restore calls
    # `cleanTargetDir(target, [], true)`). An entry carries artifacts forward
    # unrebuilt, so most are older than that: #916 added one `[[bin]]` and a
    # config table, and every workspace shard compiled its 186 dependencies
    # again, 141 to 159 s against 42 to 49 s on main (run 43144663118). This key
    # is what the dependency build is compiled from: the compiler, the pin, the
    # registry and git packages of Cargo.lock, the members' dependency lists
    # with their own versions dropped (a release changes none), the root
    # profiles and the build environment. With rust-cache's hashes off, its key
    # and restore key are this one string, so its restore is exact or nothing,
    # and nothing it restored is deleted; on a pull request's miss the step
    # after it lays main's newest entry for the group underneath (ADR 0036).
    - name: Key the dependency build by what it is compiled from
      if: inputs.caches == 'true'
      id: deps-key
      shell: bash
      run: |
        set -euo pipefail
        digest() { if command -v sha1sum >/dev/null 2>&1; then sha1sum; else shasum -a 1; fi; }
        hash="$( {
          rustc -vV
          cat rust-toolchain.toml
          awk 'BEGIN { RS = "" } /\nsource = / { print }' Cargo.lock
          awk 'BEGIN { RS = "" } /^\[\[package\]\]/ && !/\nsource = / { sub(/\nversion = "[^"]*"/, ""); print }' Cargo.lock
          awk '/^\[/ { keep = ($0 ~ /^\[profile/) } keep' Cargo.toml
          env | LC_ALL=C sort | awk -F= '$1 ~ /^(CARGO|CC|CFLAGS|CXX|CMAKE|RUST)/ && $2 != ""'
        } | digest | cut -c1-12 )"
        echo "deps key ${hash}"
        echo "hash=${hash}" >> "${GITHUB_OUTPUT}"
    - name: Cache the registry and the dependency build
      if: inputs.caches == 'true'
      id: rust-cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.cache-key }}-${{ steps.deps-key.outputs.hash }}
        add-rust-environment-hash-key: "false"
        # Every ref saving filled the 10 GiB cap and evicted main's entries,
        # so pull requests compiled cold (10.66 GiB on 2026-11-03, main 1.41).
        # Saved from main alone, the cache is one ref's worth and a pull
        # request restores the last merged build. A pull request never saves
        # to warm its own next run: the budget holds on the run that lands
        # cold, so a second run's cache hit proves nothing.
        save-if: ${{ github.ref == 'refs/heads/main' }}
        cache-on-failure: "true"
    # A pull request that moves a registry package misses the exact key, and
    # every shard compiled cold: #923 added loom to Cargo.lock, slice 6 built
    # for 2 m 34 s against main's 44 s, and the run walled at 312 s (run
    # 43311128730). rust-cache's pre-clean has run on that miss, so laying
    # main's newest entry for this group under it afterwards deletes nothing:
    # cargo's fingerprints rebuild only what the lockfile moved. These are the
    # paths rust-cache saves, in its order, so the entry's version matches; a
    # read here never saves, and rust-cache stays the one owner that writes.
    - name: Name the paths of main's dependency build
      if: inputs.caches == 'true' && github.ref != 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
      id: base-paths
      shell: bash
      run: |
        set -euo pipefail
        home="${CARGO_HOME:-$HOME/.cargo}"
        {
          echo "paths<<LGWKS_PATHS"
          printf '%s\n' "${home}/bin" "${home}/.crates.toml" "${home}/.crates2.json" "${home}/registry" "${home}/git" "${GITHUB_WORKSPACE}/target"
          echo "LGWKS_PATHS"
        } >> "${GITHUB_OUTPUT}"
    - name: Restore main's nearest dependency build under a moved lockfile
      if: steps.base-paths.outcome == 'success'
      id: base-build
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.base-paths.outputs.paths }}
        key: v0-rust-${{ inputs.cache-key }}-${{ steps.deps-key.outputs.hash }}-base
        restore-keys: v0-rust-${{ inputs.cache-key }}-
    - name: Report the base build
      if: steps.base-paths.outcome == 'success'
      shell: bash
      run: echo "base build ${{ steps.base-build.outputs.cache-matched-key || 'none' }}"
    - name: Install sccache
      if: inputs.caches == 'true' && inputs.sccache == 'true'
      continue-on-error: true
      uses: mozilla-actions/sccache-action@v0.0.11
      with:
        version: v0.18.0
    # sccache cannot cache an incremental compilation, and a hosted target
    # directory never outlives its job, so incremental state is only cost here.
    - name: Set up sccache as the compiler wrapper
      if: inputs.caches == 'true'
      shell: bash
      run: |
        {
          if [ "${{ inputs.sccache }}" = "true" ] && command -v sccache >/dev/null 2>&1; then
            echo "SCCACHE_GHA_ENABLED=true"
            echo "RUSTC_WRAPPER=sccache"
            # Writes from main alone, as rust-cache saves: a pull request's
            # writes warm only its own next run, and with eighty jobs writing
            # at once the throttled cache calls stalled whole compiles (run
            # 41777272472: the reduced-bot clippy leg printed nothing for
            # 4 m 25 s after 94 requests, with every miss a write error).
            echo "SCCACHE_GHA_RW_MODE=${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}"
          fi
          echo "CARGO_INCREMENTAL=0"
        } >> "${GITHUB_ENV}"
    - name: Install cargo-nextest
      if: inputs.nextest == 'true'
      continue-on-error: true
      uses: taiki-e/install-action@v2
      with:
        tool: nextest@0.9.149
    - name: Ensure cargo-nextest is installed
      if: inputs.nextest == 'true'
      shell: bash
      run: |
        if ! command -v cargo-nextest >/dev/null 2>&1; then
          echo "install-action failed or was rate-limited; attempting direct prebuilt fallback"
          mkdir -p "${CARGO_HOME:-$HOME/.cargo}/bin"
          if [ "${{ runner.os }}" = "Linux" ]; then
            curl -fsSL https://get.nexte.st/latest/linux | tar -xz -C "${CARGO_HOME:-$HOME/.cargo}/bin" 2>/dev/null || true
          elif [ "${{ runner.os }}" = "macOS" ]; then
            curl -fsSL https://get.nexte.st/latest/mac | tar -xz -C "${CARGO_HOME:-$HOME/.cargo}/bin" 2>/dev/null || true
          fi
        fi
        cargo-nextest --version || cargo nextest --version
