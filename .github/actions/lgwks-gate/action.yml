name: lgwks consumer gate
description: >-
  Run `lgwks-deps gate` over a consumer repository: dependency admission,
  doc citations, requirements, spec owners, `script check`, clippy with the
  flow `forbid` lints, and the architecture diff against the base — one
  summary, one exit code. See `lgwks-deps gate --help` for the legs.
author: Logical Works Incorporated

inputs:
  path:
    description: Repository to gate, relative to the checkout.
    default: .
  base:
    description: >-
      The architecture diff's base: a revision the checkout knows (needs
      fetch-depth 0) or a directory.
    default: origin/main
  toolchain:
    description: Rust toolchain the clippy leg runs under.
    default: 1.99.1
  lgwks-deps-version:
    description: >-
      lgwks_deps version to install; empty means the newest on crates.io.
      Needs the release carrying `lgwks-deps gate` (5.1.0 or later).
    default: ''
  lgwks-ast-version:
    description: >-
      lgwks_ast version to install; empty means the newest on crates.io.
      Needs the release carrying `script check` and `script diff`.
    default: ''

runs:
  using: composite
  steps:
    - name: Install the Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.toolchain }}
        components: clippy
    # The two tools are built from crates.io source (they publish no prebuilt
    # binary), so each pinned version is compiled once and its binaries cached
    # under a key naming both versions, the toolchain and the runner; an empty
    # input resolves to the newest stable release first, so the key is exact.
    - name: Resolve the tool versions
      id: tools
      shell: bash
      run: |
        set -euo pipefail
        newest() { curl -fsS -A 'lgwks-gate (github.com/Logical-Works-Inc/logicalworks-crates)' "https://crates.io/api/v1/crates/$1" | jq -er .crate.max_stable_version; }
        deps="${{ inputs.lgwks-deps-version }}"; ast="${{ inputs.lgwks-ast-version }}"
        echo "deps=${deps:-$(newest lgwks_deps)}" >> "${GITHUB_OUTPUT}"
        echo "ast=${ast:-$(newest lgwks_ast)}" >> "${GITHUB_OUTPUT}"
    - name: Cache the installed tools
      id: cache
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/bin/lgwks-deps
          ~/.cargo/bin/lgwks-ast
        key: lgwks-gate-${{ runner.os }}-${{ runner.arch }}-${{ inputs.toolchain }}-deps-${{ steps.tools.outputs.deps }}-ast-${{ steps.tools.outputs.ast }}
    - name: Install lgwks-deps
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install lgwks_deps --version "${{ steps.tools.outputs.deps }}" --locked
    - name: Install lgwks-ast
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install lgwks_ast --version "${{ steps.tools.outputs.ast }}" --features tool --locked
    - name: Run the consumer gate
      shell: bash
      run: lgwks-deps gate "${{ inputs.path }}" --base "${{ inputs.base }}"
