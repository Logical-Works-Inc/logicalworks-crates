name: ci
on:
  # A pull request already runs this matrix for its head commit, so triggering
  # on every branch push ran every job a second time for the same tree. A branch
  # is covered by its pull request; `main` is covered here, after the merge that
  # put it there.
  push:
    branches: [main]
  pull_request:
  # The same matrix on a branch's head with no commit to carry it:
  # `gh workflow run ci.yml --ref main` starts it; a run on `main` takes the
  # `main` paths of the file (the cache saves, the receipts upload).
  workflow_dispatch:

# WORKFLOW.md §12 is this workflow's specification: the nine axes it is held
# to, the budget, and the measurements behind the layout below.
#
# Every job runs on a GitHub-hosted runner (province#9, Director 2026-11-03).
# The repository is public, so hosted runners cost nothing, and a self-hosted
# runner would execute a fork's pull request on the Director's Mac. The bulk
# runs on `ubuntu-24.04-arm` (arm64, as the Mac is); `macos-15` holds the
# lanes that need Darwin (the macOS suite legs, the Metal and GPUI storefronts,
# the Miri darwin seam, the timing gates and the macOS lints); `windows-latest`
# the Windows legs.
#
# Build where you test. Each shard compiles the suite it runs and runs its
# partition in the same job, so the run's critical path is one compile plus one
# partition. The earlier layout built each suite once into a nextest archive and
# ran its shards from it, which put the archive upload, a second runner start,
# the download and the extract between the compile and the tests: 611 s of wall
# in run 41671270220, where the `lgwks_bot` library and `it` binary alone
# compiled for 150 s on Linux and 180 s on macOS after the dependencies, on
# every pull request that touches them, warm cache or not. Shards compile side
# by side, so more of them shortens the partition without lengthening the
# compile.
#
# Caching has one owner per layer (`.github/actions/hosted-rust`): rust-cache
# holds the registry and the dependency build, keyed by the lane group the job
# builds and saved from `main` alone, so pull requests stop evicting main past
# the repository's 10 GiB (9.71 GiB in 153 entries on 2026-11-03); sccache on
# the GitHub Actions backend holds compiled crates, workspace crates included,
# because every hosted job checks out at one path.
#
# The job timeout is the budget, 5 minutes: a job that passes its tests and ends
# past it is cancelled. Hung tests are bounded inside the suite by nextest's
# `slow-timeout` with `terminate-after`. The run's own wall is held to 300 s by
# the required row (`ci-wall`).

# Supersede rather than duplicate. Two `pull_request` events in one group are
# the same branch pushed twice, so the older run is cancelled. A run on `main`
# never is: that run is the record of what shipped. Each `main` push is its own
# group, keyed by commit, and a pull request by its number, not its branch name.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

# The same values as `[profile.test]` in Cargo.toml, which cargo already reads;
# they are repeated here for the cache. Swatinem/rust-cache keys on every
# `CARGO*` variable but drops `[profile]` from the manifests it hashes, so a
# profile change alone kept the old key and every run rebuilt from a cache built
# with the old profile (#272, run 38400754429). Change both together.
env:
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_TEST_OPT_LEVEL: "1"
  # sccache refuses to cache an incremental compilation, and a hosted target
  # directory never outlives its job, so incremental state is only cost.
  CARGO_INCREMENTAL: "0"
  # One warning fails the run, in every job and every cargo command (Director
  # 2026-10-28: "YOU WILL EDIT CI.YML TO FAIL ON A SINGLE CLIPPY WARNING").
  CARGO_BUILD_WARNINGS: deny

jobs:
  # Every workspace target compiles, benches and examples included, which the
  # test shards (test targets only) do not prove. The listing for the
  # simulation lane comes from the shards' own builds (`workspace_build`).
  workspace_all_targets:
    name: Build all workspace targets
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    env:
      RUSTC_WORKSPACE_WRAPPER: ""
    steps:
      - uses: actions/checkout@v7
      - name: Pin Rust 1.99.1
        uses: ./.github/actions/hosted-rust
        with:
          toolchain: "1.99.1"
          cache-key: workspace
      - name: Build all workspace targets
        run: cargo test --workspace --all-targets --locked --no-run
      # The bot shards name their test targets; a target added to the crate and
      # named in no shard would never run, so the job refuses it.
      - name: Every lgwks_bot test target is in a bot shard
        run: |
          test "$(cargo metadata --locked --format-version 1 --no-deps | jq -r '[.packages[] | select(.name == "lgwks_bot") | .targets[] | select(.kind == ["test"]) | .name] | sort | join(" ")')" = "ecs_tick it process_job sim_deep_cancel sim_review_path t03_non_yielding"

  # The simulation lane lists the test binaries the Linux shards built: the
  # first shard of each suite writes them into a nextest archive after its
  # build (SIMULATION_ARCHIVES), so nothing compiles every workspace test again
  # (cold, that alone was cancelled at 293 s in run 41627777207). It runs in
  # the shards' container, whose glibc the binaries need. It starts with the
  # shards rather than after them: it builds the lane runner while they
  # compile and takes each archive as it is uploaded, so it ends before the
  # slowest shard instead of 40 s after it (run 41698583571).
  workspace_build:
    name: Workspace build and simulation evidence
    runs-on: ubuntu-24.04-arm
    container:
      image: "rust:1.99.1-trixie"
      options: "--init --tmpfs /tmp:rw,exec,nosuid,size=6g"
    timeout-minutes: 5
    env:
      RUSTC_WORKSPACE_WRAPPER: ""
      SIMULATION_ARCHIVES: nextest-archive/nextest-archive-workspace-Linux/suite.tar.zst nextest-archive/nextest-archive-bot-it-Linux/suite.tar.zst nextest-archive/nextest-archive-bot-rest-Linux/suite.tar.zst
    steps:
      - uses: actions/checkout@v7
      - name: Pin Rust 1.99.1
        uses: ./.github/actions/hosted-rust
        with:
          toolchain: "1.99.1"
          cache-key: workspace
          nextest: "true"
      - name: Build the simulation lane
        run: cargo build --locked -p lgwks_deps --bin ci-local
      - name: Wait for the Linux suite archives
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            listed="$(curl -fsS --retry 3 -H "Authorization: Bearer ${TOKEN}" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" | tr -d ' \n')"
            missing=""
            for suite in workspace bot-it bot-rest; do
              case "${listed}" in *"\"name\":\"nextest-archive-${suite}-Linux\""*) ;; *) missing="${missing} ${suite}" ;; esac
            done
            if [ -z "${missing}" ]; then echo "every suite archive is uploaded"; exit 0; fi
            echo "attempt ${attempt}: waiting on${missing}"
            sleep 4
          done
          echo "::error::the suite archives never arrived:${missing}"
          exit 1
      - name: Download the Linux test archives
        uses: actions/download-artifact@v8
        with:
          pattern: nextest-archive-*-Linux
          path: nextest-archive
      - name: Deterministic simulation evidence
        run: |
          set -euo pipefail
          mkdir -p gate-evidence
          cargo run --locked -p lgwks_deps --bin ci-local -- --lane simulation-evidence | tee gate-evidence/simulation-evidence.txt
      - name: Upload simulation evidence
        uses: actions/upload-artifact@v7
        with:
          name: gate-evidence-simulation
          path: gate-evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Cache hit rate
        if: ${{ always() }}
        run: sccache --show-stats

  # The Linux shards. They build and run in the `rust:<pin>-trixie` container
  # the Mac's Linux leg used: its util-linux 2.41 `setpriv` applies the
  # Landlock rules `Confinement::Landlock` wraps (#337), which the runner
  # image's older util-linux cannot. `--init` gives PID 1 a reaper, as a Linux
  # host has, and `/tmp` is an executable tmpfs, because the suites run scripts
  # they write there and fsync every durable record. The lgwks-bot full suite's
  # JUnit reports are the Linux receipt (#271), one per shard.
  #
  # lgwks_bot full is two builds: its consolidated `it` binary, and every other
  # target. The workspace suite leaves lgwks_bot's test binaries out (the
  # `tests` lane filters `not package(lgwks_bot)` either way). Partitions are
  # sized on cold run 41698583571: `it` compiled 135 to 139 s and ran 67 to
  # 79 s a quarter; the workspace compiled 92 to 103 s and its first third ran
  # 144 s, past the job limit.
  tests_linux:
    name: Tests on Linux (${{ matrix.archive }}, ${{ matrix.partition }})
    runs-on: ubuntu-24.04-arm
    container:
      image: "rust:1.99.1-trixie"
      options: "--init --tmpfs /tmp:rw,exec,nosuid,size=6g"
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: workspace, archive: workspace, partition: "slice:1/6", build: "--workspace --exclude lgwks_bot --locked" }
          - { suite: workspace, archive: workspace, partition: "slice:2/6", build: "--workspace --exclude lgwks_bot --locked" }
          - { suite: workspace, archive: workspace, partition: "slice:3/6", build: "--workspace --exclude lgwks_bot --locked" }
          - { suite: workspace, archive: workspace, partition: "slice:4/6", build: "--workspace --exclude lgwks_bot --locked" }
          - { suite: workspace, archive: workspace, partition: "slice:5/6", build: "--workspace --exclude lgwks_bot --locked" }
          - { suite: workspace, archive: workspace, partition: "slice:6/6", build: "--workspace --exclude lgwks_bot --locked" }
          - { suite: bot-full, archive: bot-it, partition: "slice:1/5", build: "-p lgwks_bot --test it --locked --features full" }
          - { suite: bot-full, archive: bot-it, partition: "slice:2/5", build: "-p lgwks_bot --test it --locked --features full" }
          - { suite: bot-full, archive: bot-it, partition: "slice:3/5", build: "-p lgwks_bot --test it --locked --features full" }
          - { suite: bot-full, archive: bot-it, partition: "slice:4/5", build: "-p lgwks_bot --test it --locked --features full" }
          - { suite: bot-full, archive: bot-it, partition: "slice:5/5", build: "-p lgwks_bot --test it --locked --features full" }
          - { suite: bot-full, archive: bot-rest, partition: "", build: "-p lgwks_bot --lib --bins --examples --test ecs_tick --test process_job --test sim_deep_cancel --test sim_review_path --test t03_non_yielding --locked --features full" }
    env:
      PARTITION: ${{ matrix.partition }}
      NEXTEST_BUILD: ${{ matrix.build }}
      # Lints run once, in the Clippy jobs; the compiled code is identical.
      RUSTC_WORKSPACE_WRAPPER: ""
    steps:
      - uses: actions/checkout@v7
      - name: Pin Rust 1.99.1
        uses: ./.github/actions/hosted-rust
        with:
          toolchain: "1.99.1"
          cache-key: ${{ matrix.archive }}
          nextest: "true"
      - name: Prepare the checkout
        run: command -v sqlite3 >/dev/null || { apt-get -qq update && apt-get -qq install -y sqlite3; }
      - name: Build the suite
        run: cargo nextest list ${NEXTEST_BUILD} --message-format oneline >/dev/null
      # The simulation lane's input: the binaries this build already made,
      # archived once per suite (nextest writes into an existing directory
      # only, run 41605078279).
      - name: Archive the suite for the simulation lane
        if: startsWith(matrix.partition, 'slice:1/') || matrix.partition == ''
        run: mkdir -p nextest-archive && cargo nextest archive ${NEXTEST_BUILD} --archive-file nextest-archive/suite.tar.zst
      - name: Upload the suite archive
        if: startsWith(matrix.partition, 'slice:1/') || matrix.partition == ''
        uses: actions/upload-artifact@v7
        with:
          name: nextest-archive-${{ matrix.archive }}-Linux
          path: nextest-archive/suite.tar.zst
          if-no-files-found: error
          retention-days: 1
      - name: Run all workspace tests
        if: matrix.suite == 'workspace'
        run: cargo nextest run ${NEXTEST_BUILD:---workspace --locked} -E 'not binary(storefront_consumers) and not package(lgwks_bot)' ${PARTITION:+--partition $PARTITION}
      - name: Run lgwks-bot async runner tests
        if: matrix.suite == 'bot-full'
        run: cargo nextest run ${NEXTEST_BUILD:--p lgwks_bot --all-targets --locked --features full} --profile ci -E 'not test(saturation_r32_tier)' ${PARTITION:+--partition $PARTITION}
      - name: Upload Linux lgwks-bot JUnit report
        if: matrix.suite == 'bot-full'
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-junit-linux-${{ strategy.job-index }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 7
      - name: Cache hit rate
        if: ${{ always() }}
        run: sccache --show-stats

  # The macOS shards hold the Darwin seams (province#9: macos-15 for the darwin
  # syscall seams, Miri darwin and the timing gates; Miri and the timing gates
  # are jobs of their own): lgwks_std, whose fs, process and time seams take
  # the Darwin branch, and lgwks_bot's own process-boundary binaries and
  # review-path saturation set. The full lgwks_bot and workspace suites run on
  # the Linux shards. On 3 vCPU a cold macOS shard compiles dependencies for
  # 138 s even at opt-level 1 and was still compiling `lgwks_bot`'s `it` binary
  # at the 5-minute limit (run 41700839783), so `it` does not run here. Each test
  # process runs through the `churn-slot` wrapper the suite's setup script
  # builds (INV-CI-SLOT-1). Every macOS shard builds through the `ci-it`
  # profile, dependencies at opt-level 1 and workspace crates at 0; the root
  # Cargo.toml says what the profile keeps.
  tests_macos:
    name: Tests on macOS (${{ matrix.archive }}, ${{ matrix.partition }})
    runs-on: macos-15
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: workspace, archive: workspace-core, partition: "slice:1/2", build: "-p lgwks_std --locked --cargo-profile ci-it" }
          - { suite: workspace, archive: workspace-core, partition: "slice:2/2", build: "-p lgwks_std --locked --cargo-profile ci-it" }
          - { suite: bot-full, archive: bot-rest, partition: "", build: "-p lgwks_bot --test ecs_tick --test process_job --test sim_deep_cancel --test t03_non_yielding --locked --features full --cargo-profile ci-it" }
          # The review-path binary under the saturation filter (T31-T34), in
          # thirds: whole, it ran 46 tests past the limit after a 184 s build
          # (run 41702461553).
          - { suite: saturation, archive: bot-rest, partition: "slice:1/3", build: "-p lgwks_bot --locked --features full --cargo-profile ci-it", sat_bins: "--test sim_review_path", sat_filter: "binary(sim_review_path)" }
          - { suite: saturation, archive: bot-rest, partition: "slice:2/3", build: "-p lgwks_bot --locked --features full --cargo-profile ci-it", sat_bins: "--test sim_review_path", sat_filter: "binary(sim_review_path)" }
          - { suite: saturation, archive: bot-rest, partition: "slice:3/3", build: "-p lgwks_bot --locked --features full --cargo-profile ci-it", sat_bins: "--test sim_review_path", sat_filter: "binary(sim_review_path)" }
    env:
      PARTITION: ${{ matrix.partition }}
      NEXTEST_BUILD: ${{ matrix.build }}
      RUSTC_WORKSPACE_WRAPPER: ""
      # The bot shards are built under `ci-it` (workspace crates at opt-level
      # 0), whose unoptimized frames overflowed the 2 MiB test thread in
      # pr_review_journey and sim_review_path (run 41661639388; the same tests
      # pass at opt-level 1 on the Linux shards). Test threads get the 8 MiB a
      # macOS main thread has.
      RUST_MIN_STACK: "8388608"
    steps:
      - uses: actions/checkout@v7
      - name: Pin Rust 1.99.1
        uses: ./.github/actions/hosted-rust
        with:
          toolchain: "1.99.1"
          cache-key: ${{ matrix.archive }}
          nextest: "true"
      - name: Run all workspace tests
        if: matrix.suite == 'workspace'
        run: cargo nextest run ${NEXTEST_BUILD:---workspace --locked} -E 'not binary(storefront_consumers) and not package(lgwks_bot)' ${PARTITION:+--partition $PARTITION}
      - name: Run lgwks-bot async runner tests
        if: matrix.suite == 'bot-full'
        run: cargo nextest run ${NEXTEST_BUILD:--p lgwks_bot --all-targets --locked --features full} --profile ci -E 'not test(saturation_r32_tier)' ${PARTITION:+--partition $PARTITION}
      # The saturation tiers (100, 1,000 and 10,000 concurrent runs through a
      # real process boundary), the review-path simulations and `sim_scale`,
      # with `--ignore-default-filter` lifting the `ci` profile's macOS filter.
      - name: Run lgwks-bot saturation tiers
        if: matrix.suite == 'saturation'
        env:
          SATURATION_BINARIES: ${{ matrix.sat_bins }}
          SATURATION_FILTER: ${{ matrix.sat_filter }}
        run: cargo nextest run ${NEXTEST_BUILD:--p lgwks_bot --locked --features full} --profile ci --ignore-default-filter ${SATURATION_BINARIES---test sim_review_path} -E "${SATURATION_FILTER:-binary(sim_review_path)}" ${PARTITION:+--partition $PARTITION}
      # Under the `lgwks-bot-junit-*` name the required row downloads: the
      # review-path tests (T31-T34) are named in `docs/acceptance/t-rows.toml`.
      - name: Upload lgwks-bot JUnit report
        if: matrix.suite != 'workspace'
        uses: actions/upload-artifact@v7
        with:
          name: lgwks-bot-junit-${{ matrix.suite }}-${{ strategy.job-index }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 7
      - name: Cache hit rate
        if: ${{ always() }}
        run: sccache --show-stats

  # The workspace's evidence lanes, doc tests and package smoke, and the
  # receipts tool the required row runs: each reads a build rather than a test
  # archive, and none waits on the suites.
  workspace_tail:
    name: Workspace evidence and doc tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    env:
      RUSTC_WORKSPACE_WRAPPER: ""
    steps:
      - uses: actions/checkout@v7
      - name: Pin Rust 1.99.1
        uses: ./.github/actions/hosted-rust
        with:
          toolchain: "1.99.1"
          cache-key: workspace
          nextest: "true"
      - name: Install the acceptance-receipts binary
        run: |
          set -euo pipefail
          cargo build --locked -p lgwks_deps --bin acceptance-receipts
          mkdir -p receipts-tool
          cp target/debug/acceptance-receipts receipts-tool/
      - name: Upload the acceptance-receipts binary
        uses: actions/upload-artifact@v7
        with:
          name: receipts-tool
          path: receipts-tool/
          if-no-files-found: error
          retention-days: 1
      - name: Debug doctor end-to-end journey
        run: |
          set -euo pipefail
          mkdir -p gate-evidence
          cargo run --locked -p lgwks_deps --bin ci-local -- --lane debug-e2e | tee gate-evidence/debug-e2e.txt
      - name: Upload gate evidence
        uses: actions/upload-artifact@v7
        with:
          name: gate-evidence
          path: gate-evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Doc tests
        run: cargo test --workspace --doc --locked
      - name: Run package smoke test
        run: ./scripts/lgwks-std-package-smoke.sh

  # The checks that read the tree rather than test it, in a job of their own:
  # none builds the workspace's tests, so they need not wait on that compile.
  gate:
    name: Gate checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    env:
      RUSTC_WORKSPACE_WRAPPER: ""
    steps:
      - uses: actions/checkout@v7
      - name: Pin Rust 1.99.1
        uses: ./.github/actions/hosted-rust
        with:
          toolchain: "1.99.1"
          cache-key: gate
          sccache: "false"
          components: clippy, rustfmt
          nextest: "true"
      - name: Verify lockfile is up-to-date
        run: >
          cargo metadata --locked --format-version 1 >/dev/null ||
          { echo 'Lockfile out of date: run cargo update --workspace and commit Cargo.lock' >&2; exit 1; } &&
          for f in crates/lgwks-deps/tests/fixtures/*/Cargo.lock; do if ! cargo metadata --locked --format-version 1 --manifest-path "${f%.lock}.toml" >/dev/null; then echo "stale fixture lockfile $f: run cargo update --workspace --manifest-path ${f%.lock}.toml" >&2; exit 1; fi; done
      - name: Check formatting
        run: cargo fmt --all -- --check && cargo fmt --manifest-path bench/async/Cargo.toml --all -- --check
      - name: Enforce dependency edge ownership
        run: cargo run --locked -p lgwks_deps --bin lgwks-deps -- check .
      - name: Verify invariant enforcement references resolve
        run: cargo run --locked -p lgwks_deps --bin ci-local -- --lane invariants
      - name: Audit std-first and lgwks_std-first
        # The manifest gate above sees every authored edge. This reads the
        # source for the two failures a manifest cannot show: a `use` no
        # manifest declares, and a capability hand-rolled beside the
        # `lgwks_std` module that already provides it.
        run: cargo run --locked -p lgwks_deps --bin check-std-first
      - name: Forbid unwrap outside tests
        # Safety bar: library code fails loud with typed errors or named
        # expects, never bare unwrap. Doc examples count as shipped surface.
        run: cargo run --locked -p lgwks_deps --bin ci-local -- --lane unwrap-scan
      - name: Validate the dependency contract alignment
        run: cargo run --locked -p lgwks_deps --bin ci-local -- --lane contract-drift
      - name: Requirements sentences unedited without supersession
        run: cargo run --locked -p lgwks_deps --bin check-requirements && cargo run --locked -p lgwks_deps --bin check-spec-owners
      - name: llms.txt matches the documentation index
        # `llms.txt` is generated from the README's own tables by the
        # `llms-txt` binary. Regenerate and fail if the committed copy differs,
        # so the index cannot drift from the documents it points at.
        run: |
          set -eu
          cargo run --locked -p lgwks_deps --bin llms-txt
          git diff --exit-code -- llms.txt
      - name: Documentation citations resolve
        # The guides cite `path:NNN` for each factual claim; this checks that
        # the file exists and the line exists in it.
        run: cargo run --locked -p lgwks_deps --bin check-doc-citations
      - name: The capability catalog matches the tree
        # #732: one register, one generated page, and a refusal for a row whose
        # owner file, feature or module is gone.
        run: cargo run --locked -p lgwks_deps --bin catalog -- --check .
      - name: ADRs and PRDs hold their required fields
        # ADR 0004: every ADR against ISO/IEC/IEEE 42010 and every PRD
        # requirement against ISO/IEC/IEEE 29148.
        run: cargo run --locked -p lgwks_deps --bin check-docs
      - name: Root README quickstart matches its compiled example
        run: cargo run --locked -p lgwks_deps --bin ci-local -- --lane readme-quickstart

  # The RustSec advisories (#635), beside the gate rather than a step of it: the
  # audit is a network read (the advisory database), which this file cannot
  # bound, and a job of its own gives the lane its own check row.
  advisories:
    name: RustSec advisories
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # The prebuilt release, checksum-verified, rather than a `cargo install`
      # that compiles the audit's own dependency stack before it can run.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - name: Audit RustSec advisories
        run: cargo audit --file Cargo.lock

  # The two results the checks list names on every pull request. Each reads the
  # report its lane wrote (simulation evidence in the workspace build job, the
  # debug journey in the evidence job) and passes only on that lane's own pass
  # line, so the row is exactly the lane's verdict on this commit.
  simulation_evidence:
    name: successful simulation result
    needs: workspace_build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Download gate evidence
        uses: actions/download-artifact@v8
        with:
          name: gate-evidence-simulation
          path: gate-evidence
      - name: Check successful simulation result
        run: |
          cat gate-evidence/simulation-evidence.txt && grep -q '^<== simulation-evidence: pass' gate-evidence/simulation-evidence.txt

  debug_e2e:
    name: successful end-to-end journey result
    needs: workspace_tail
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Download gate evidence
        uses: actions/download-artifact@v8
        with:
          name: gate-evidence
          path: gate-evidence
      - name: Check successful end-to-end journey result
        run: |
          cat gate-evidence/debug-e2e.txt && grep -q '^<== debug-e2e: pass' gate-evidence/debug-e2e.txt

  # The lgwks-std full-feature suite. Its compile and its tests are bounded
  # apart: as one three-minute step a cold compile (2 m 12 s on run
  # 41563372316) left the 1,324 tests 48 s.
  tests_std_full:
    name: Tests (lgwks-std full)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    env:
      RUSTC_WORKSPACE_WRAPPER: ""
    steps:
      - uses: actions/checkout@v7
      - name: Pin Rust 1.99.1
        uses: ./.github/actions/hosted-rust
        with:
          toolchain: "1.99.1"
          cache-key: std-full
          sccache: "false"
          nextest: "true"
      - name: Build lgwks-std full-feature tests
        # Stops before the job limit so the cache is saved.
        timeout-minutes: 3
        run: cargo nextest run -p lgwks_std --all-targets --locked --features full --no-run
      - name: Run lgwks-std full-feature tests
        timeout-minutes: 2
        run: cargo nextest run -p lgwks_std --all-targets --locked --features full ${PARTITION:+--partition $PARTITION}
      # A step cut by its timeout leaves the processes it started running, and
      # they kept writing into `target/`: main's save after the cut on run
      # 41561323534 failed with "tar: target/debug/deps: file changed as we
      # read it". This stops them, on every outcome, before the cache step's
      # post action archives the target.
      - name: Cache save, after stopping what the test step left running
        if: ${{ always() }}
        run: |
          pkill -KILL -f "${GITHUB_WORKSPACE}/target/" || true
          pkill -KILL -x cargo-nextest || true
          pkill -KILL -x cargo || true
          timeout 10 bash -c 'while pgrep -f "${GITHUB_WORKSPACE}/target/" > /dev/null; do sleep 0.2; done'

  # The lgwks-bot suite at no default features, in a job of its own.
  tests_nodefault:
    name: Tests (lgwks-bot no default features)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    env:
      RUSTC_WORKSPACE_WRAPPER: ""
    steps:
      - uses: actions/checkout@v7
      - name: Pin Rust 1.99.1
        uses: ./.github/actions/hosted-rust
        with:
          toolchain: "1.99.1"
          cache-key: bot-nodefault
          nextest: "true"
      - name: Run lgwks-bot no-default-feature tests
        run: cargo nextest run -p lgwks_bot --all-targets --locked --no-default-features ${PARTITION:+--partition $PARTITION}

  # Lints, on macOS: the Darwin `cfg` paths are the ones the suites' Linux legs
  # cannot reach, and the lint legs have run there since they moved off the
  # Mac's instances. Four legs, each its own feature family and cache.
  clippy:
    name: Clippy and scan (${{ matrix.part }})
    runs-on: macos-15
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        part: [workspace, features, scan, reduced]
    steps:
      - uses: actions/checkout@v7
      - name: Pin Rust 1.99.1
        uses: ./.github/actions/hosted-rust
        with:
          toolchain: "1.99.1"
          cache-key: clippy-${{ matrix.part }}
          components: clippy
      - name: Clippy all workspace targets
        if: matrix.part == 'workspace'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # INV-SCAN-ZERO: the scan refuses on any finding rather than reporting a
      # count. The two tool runs build optimised binaries without the release
      # profile's fat LTO: what they report does not depend on how their own
      # binary was linked.
      - name: Scan reports zero findings
        if: matrix.part == 'scan'
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
        run: cargo run --locked --release -p lgwks_ast --no-default-features --features tool,scan --bin lgwks-ast -- scan
      # #384: every `script!` in the tree, read by the one parser the macro
      # calls (SL-2), without compiling it.
      - name: Every script! in the repository reads
        if: matrix.part == 'scan'
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
        run: cargo run --locked --release -p lgwks_ast --no-default-features --features tool,scan --bin lgwks-ast -- script check
      - name: Clippy feature matrix
        if: matrix.part == 'features'
        # Per-crate all-features (gpui excluded: it needs the Xcode Metal
        # toolchain and is checked by its own lane in the matrix job).
        run: >
          cargo clippy --locked --manifest-path crates/lgwks-bot/Cargo.toml
          --all-targets --all-features -- -D warnings &&
          cargo clippy --locked --manifest-path crates/lgwks-ast/Cargo.toml
          --all-targets --all-features -- -D warnings &&
          cargo clippy --locked --manifest-path crates/lgwks-deps/Cargo.toml
          --all-targets --features tokio-full -- -D warnings
      - name: Clippy no default features
        if: matrix.part == 'reduced'
        run: >
          cargo clippy --locked --manifest-path crates/lgwks-bot/Cargo.toml
          --all-targets --no-default-features -- -D warnings &&
          cargo clippy --locked --manifest-path crates/lgwks-ast/Cargo.toml
          --all-targets --no-default-features -- -D warnings &&
          cargo clippy --locked --manifest-path crates/lgwks-ast/Cargo.toml
          --all-targets --no-default-features --features parser -- -D warnings &&
          cargo clippy --locked --manifest-path crates/lgwks-deps/Cargo.toml
          --all-targets --no-default-features -- -D warnings &&
          cargo clippy --locked --manifest-path crates/lgwks-macros/Cargo.toml
          --all-targets --no-default-features -- -D warnings
      - name: Clippy process-only
        if: matrix.part == 'reduced'
        # `process` alone is a supported consumer shape (issue #131).
        run: >
          cargo clippy --locked --manifest-path crates/lgwks-bot/Cargo.toml
          --all-targets --no-default-features --features process -- -D warnings

  # The documentation lanes, apart from the lints: rustdoc builds its own output
  # for each feature set. `scripts/doc-lanes.sh` holds the commands and the
  # reason for each lane, so this job and a contributor run the same ones.
  docs:
    name: Docs and release gates
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Pin Rust 1.99.1
        uses: ./.github/actions/hosted-rust
        with:
          toolchain: "1.99.1"
          cache-key: docs
          sccache: "false"
          components: clippy
      - name: Doc build with broken-link denial
        run: ./scripts/doc-lanes.sh all-features
      - name: Doc build without default features
        # A module in `core` that links to a feature-gated module resolves
        # under `--all-features` and breaks here.
        run: ./scripts/doc-lanes.sh no-default-features
      - name: Doc build at the default feature set
        # The set `cargo add lgwks_std` hands a consumer, which neither boundary
        # lane builds.
        run: ./scripts/doc-lanes.sh default

  # The lgwks-deps storefronts and the standalone consumer packages. The GPUI,
  # GPUI fixture and Metal ML legs need Apple's toolchain; the rest are
  # portable and run on Linux. A leg runs only the steps named for it, so every
  # check runs exactly once per commit.
  storefront-matrix:
    name: Target and storefront matrix (${{ matrix.part }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: deps, os: ubuntu-24.04-arm, cache: storefront-deps }
          - { part: gpui, os: macos-15, cache: storefront-gpui }
          - { part: gpui-fixture, os: macos-15, cache: storefront-gpui-fixture }
          - { part: ml, os: macos-15, cache: storefront-ml }
          - { part: consumers-1, os: ubuntu-24.04-arm, cache: storefront, partition: "slice:1/3" }
          - { part: consumers-2, os: ubuntu-24.04-arm, cache: storefront, partition: "slice:2/3" }
          - { part: consumers-3, os: ubuntu-24.04-arm, cache: storefront, partition: "slice:3/3" }
    steps:
      - uses: actions/checkout@v7
      - name: Pin Rust 1.99.1
        uses: ./.github/actions/hosted-rust
        with:
          toolchain: "1.99.1"
          cache-key: ${{ matrix.cache }}
          sccache: "false"
          nextest: "true"
      - name: Check lgwks-deps
        if: matrix.part == 'deps'
        run: cargo check --locked --manifest-path crates/lgwks-deps/Cargo.toml --all-targets
      - name: Check lgwks-deps storefront engine feature
        if: matrix.part == 'deps'
        run: cargo check --locked --manifest-path crates/lgwks-deps/Cargo.toml --all-targets --features tokio
      - name: Check lgwks-deps GPUI storefront feature
        if: matrix.part == 'gpui'
        run: cargo check --locked --manifest-path crates/lgwks-deps/Cargo.toml --all-targets --features gpui
      - name: Check lgwks-deps ML storefront features
        if: matrix.part == 'ml'
        run: cargo check --locked --manifest-path crates/lgwks-deps/Cargo.toml --all-targets --features ml-candle,ml-tokenizers
      - name: Check normal GPUI renderer feature
        if: matrix.part == 'gpui-fixture'
        # The fixture is its own workspace, so it compiles the GPUI stack into
        # the target directory this leg owns.
        run: >
          cargo check --locked
          --manifest-path crates/lgwks-deps/tests/fixtures/storefront-matrix/Cargo.toml
          --target-dir "${CARGO_TARGET_DIR:-target}"
          --no-default-features --features gpui --example gpui
      - name: Check Candle Metal storefront features
        if: matrix.part == 'ml'
        run: cargo check --locked -p lgwks_deps --all-targets --features ml-candle-metal,ml-tokenizers
      # Standalone consumer packages, one cargo build per storefront family,
      # sharing one target directory, sharded across three runners.
      - name: Build storefront consumers
        if: startsWith(matrix.part, 'consumers')
        env:
          PARTITION: ${{ matrix.partition }}
        run: cargo nextest run --locked -p lgwks_deps --test storefront_consumers ${PARTITION:+--partition $PARTITION}

  # The declared target matrix, one leg per group of targets, each with the host
  # triple the script always adds. The hosted runner is arm64 Linux, so its own
  # C compiler reaches `aarch64-unknown-linux-gnu`, and that leg also builds the
  # two §4.7 cells (`tests-linux`) the Mac could reach only from a container.
  target-matrix:
    name: Target matrix (${{ matrix.targets }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        targets:
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl wasm32-wasip1
          - x86_64-unknown-freebsd aarch64-linux-android aarch64-apple-ios
    steps:
      - uses: actions/checkout@v7
      - name: Pin Rust 1.99.1
        uses: ./.github/actions/hosted-rust
        with:
          toolchain: "1.99.1"
          cache-key: targets
      - name: Check lgwks-std across the declared target matrix
        # `cargo check --target <t>` for every declared target and crate. The
        # runner installs the target with rustup first, requires the Rust-only
        # surface everywhere, and records with its exact error any check this
        # runner has no C toolchain to reach (ADR 0003, "the target veto").
        # MATRIX_TARGETS names the targets this leg checks (unset, the runner
        # checks them all): the gate-parity check compares this text with
        # scripts/gate-lanes.toml.
        env:
          MATRIX_TARGETS: ${{ matrix.targets }}
        run: cargo run --locked -q -p lgwks_deps --bin check-target-matrix -- ${MATRIX_TARGETS:-}
      - name: Check the aarch64-unknown-linux-gnu target cells
        if: matrix.targets == 'aarch64-unknown-linux-gnu'
        run: cargo check --locked -p lgwks_std --features full --target aarch64-unknown-linux-gnu && cargo check --locked -p lgwks_ast --target aarch64-unknown-linux-gnu

  # The two release-build timing gates, apart from the lints: each measures wall
  # time. On arm64 Linux, the server class the services ship to (province#9
  # keeps macOS for darwin-only lanes), with the bounds unchanged: on the 3-vCPU
  # macOS VM json parse read p50 512 ns, p99 1 561 ns (run 41607020833).
  timing_gates:
    name: Timing gates (dudect, async fairness, latency tails)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Pin Rust 1.99.1
        uses: ./.github/actions/hosted-rust
        with:
          toolchain: "1.99.1"
          cache-key: timing
      - name: Digest constant-time equality (dudect)
        # 250,000 samples per class: t scales with √N, and the early-exit
        # control still reads four orders past the 4.5 threshold.
        run: cargo run --release --locked -p lgwks_std --features hash --example digest_timing -- --samples 250000
      - name: The hot calls hold their latency tails
        # Every leaf call in lgwks_std, each bounded at 500 ns p50 and 1 500 ns
        # p99 (ADR 0003).
        run: cargo run --release --locked -p lgwks_std --example latency_tails

  # The async fairness gate and concurrency ladder: the bench workspace run four
  # ways (the suite, a mutant check, the tiers and the matrix).
  timing_async:
    name: Async fairness gate and concurrency ladder
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Pin Rust 1.99.1
        uses: ./.github/actions/hosted-rust
        with:
          toolchain: "1.99.1"
          cache-key: bench-async
      - name: Async fairness gate and concurrency ladder
        run: cargo test --locked --manifest-path bench/async/Cargo.toml --bin lgwks-bench-async && cargo run --release --locked --manifest-path bench/async/Cargo.toml -- --mutant-check && cargo run --release --locked --manifest-path bench/async/Cargo.toml -- --tiers && cargo run --release --locked --manifest-path bench/async/Cargo.toml -- --matrix

  # The lgwks-bot and lgwks-ast compile matrices and the grammar execution, on
  # hosted arm64 Linux: every leg checks or runs portable code, and docs.rs
  # itself builds on Linux, so the docs.rs leg reads the platform it predicts.
  feature-matrix-bot-ast:
    name: Feature matrix (${{ matrix.part }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: docs.rs
          - part: lgwks-bot
          - part: lgwks-bot all
          - part: lgwks-ast
          - part: lgwks-bot WASI
    steps:
      - uses: actions/checkout@v7
      - name: Pin Rust 1.99.1
        uses: ./.github/actions/hosted-rust
        with:
          toolchain: "1.99.1"
          cache-key: feature-${{ matrix.part }}
          sccache: "false"
      - name: docs.rs metadata names a buildable feature set
        if: matrix.part == 'docs.rs'
        # docs.rs builds with whatever `[package.metadata.docs.rs]` declares,
        # and a failure there is invisible from the repository. The lane builds
        # with a nightly toolchain that carries no clippy, and
        # `.cargo/config.toml` routes workspace compiles through clippy-driver
        # (run 41296957496), so the wrapper is off here; the check legs keep the
        # lints.
        env:
          RUSTC_WORKSPACE_WRAPPER: ""
        run: cargo run --locked -p lgwks_deps --bin ci-local -- --lane docsrs-metadata
      - name: Check lgwks-bot async feature matrix
        if: matrix.part == 'lgwks-bot'
        run: |
          set -eu
           cargo check --locked --manifest-path crates/lgwks-bot/Cargo.toml --all-targets --no-default-features
           cargo check --locked --manifest-path crates/lgwks-bot/Cargo.toml --all-targets
      - name: Check lgwks-bot all-features matrix
        if: matrix.part == 'lgwks-bot all'
        run: |
          set -eu
           cargo check --locked --manifest-path crates/lgwks-bot/Cargo.toml --all-targets --features net,process,fs,signal
           cargo check --locked --manifest-path crates/lgwks-bot/Cargo.toml --all-targets --all-features
      - name: Check lgwks-bot WASI runtime boundary
        if: matrix.part == 'lgwks-bot WASI'
        run: |
          set -eu
          rustup target add wasm32-wasip1
           RUSTFLAGS="" cargo check --locked --manifest-path crates/lgwks-bot/Cargo.toml --target wasm32-wasip1 --features rt
      - name: Check lgwks-ast feature matrix
        if: matrix.part == 'lgwks-ast'
        run: |
          set -eu
           cargo check --locked --manifest-path crates/lgwks-ast/Cargo.toml --all-targets --no-default-features
           cargo check --locked --manifest-path crates/lgwks-ast/Cargo.toml --all-targets --no-default-features --features parser
           cargo check --locked --manifest-path crates/lgwks-ast/Cargo.toml --all-targets
           cargo check --locked --manifest-path crates/lgwks-ast/Cargo.toml --all-targets --all-features
      - name: Execute the lgwks-ast grammar matrix
        if: matrix.part == 'lgwks-ast'
        # The check above proves each combination compiles; this executes it.
        # The 28 grammars go in ONE `cargo test` invocation, not a loop of 28:
        # each invocation re-resolves the feature set and relinks the whole
        # ast-grep and tree-sitter stack. Opt-level 0: each leg parses a fixture
        # per grammar in milliseconds. Assertions are unchanged.
        env:
          CARGO_PROFILE_TEST_OPT_LEVEL: "0"
        run: |
          set -u
          failed=0
          execute() {
            echo "::group::$*"
            if ! "$@"; then
              echo "::error::lgwks-ast grammar matrix failed: $*"
              failed=1
            fi
            echo "::endgroup::"
          }
          execute cargo test --locked -p lgwks_ast --lib --no-default-features
          # The parser with no grammar compiled (#367).
          execute cargo test --locked -p lgwks_ast --lib --no-default-features --features parser
          execute cargo test --locked -p lgwks_ast --lib
          # Every standalone grammar, one build.
          execute cargo test --locked -p lgwks_ast --lib --no-default-features \
            --features lang-bash,lang-c,lang-cpp,lang-csharp,lang-css,lang-dart,lang-elixir,lang-go,lang-haskell,lang-hcl,lang-html,lang-java,lang-javascript,lang-json,lang-kotlin,lang-lua,lang-md,lang-nix,lang-php,lang-python,lang-ruby,lang-rust,lang-scala,lang-solidity,lang-swift,lang-tsx,lang-typescript,lang-yaml
          execute cargo test --locked -p lgwks_ast --lib --all-features
          exit "$failed"

  appcui-native:
    name: AppCUI native storefront
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Pin Rust 1.99.1
        uses: ./.github/actions/hosted-rust
        with:
          toolchain: "1.99.1"
          cache-key: appcui
          components: clippy
      - run: cargo test --locked -p lgwks_deps --no-default-features --features appcui --lib
      - run: cargo test --locked -p lgwks_deps --no-default-features --features appcui --doc
      - run: cargo clippy --locked -p lgwks_deps --no-default-features --features appcui --all-targets -- -D warnings

  # The AppCUI legs on Windows and Linux, beside the macOS one.
  appcui-native-hosted:
    name: AppCUI native storefront hosted (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
      - name: Pin Rust 1.99.1
        uses: ./.github/actions/hosted-rust
        with:
          toolchain: "1.99.1"
          cache-key: appcui
          components: clippy
      - run: cargo test --locked -p lgwks_deps --no-default-features --features appcui --lib
      - run: cargo test --locked -p lgwks_deps --no-default-features --features appcui --doc
      - run: cargo clippy --locked -p lgwks_deps --no-default-features --features appcui --all-targets -- -D warnings

  # Its own job rather than a step of the AppCUI Windows leg: the GPUI build is
  # 194 s, and behind the AppCUI steps it made that leg the run's longest job.
  gpui-windows:
    name: GPUI Windows renderer
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Pin Rust 1.99.1
        uses: ./.github/actions/hosted-rust
        with:
          toolchain: "1.99.1"
          cache-key: storefront-fixture-target
          sccache: "false"
      - name: Check GPUI Windows renderer fixture
        run: >
          cargo check --locked
          --manifest-path crates/lgwks-deps/tests/fixtures/storefront-matrix/Cargo.toml
          --target-dir target
          --no-default-features --features gpui --example gpui

  # #263 on Windows, executed. The job object a supervised tree lives in is the
  # kernel's own membership list, so the only evidence that containment works is
  # a Windows host running the supervisor's real path and reading that list empty
  # (`crates/lgwks-bot/tests/process_job.rs`). #271: the same step runs the `it`
  # tests named for their row (`_tNN`); its JUnit report is the Windows receipt
  # (`docs/acceptance/t-rows-windows.toml`).
  process-windows:
    name: Process containment on Windows
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      RUSTC_WORKSPACE_WRAPPER: ""
      # On a hosted Windows runner the default CARGO_HOME is on the C: drive,
      # and `cargo metadata --locked` took 23 s and 25 s there against 10 s with
      # CARGO_HOME on D:, where the workspace already is (run 39108008198).
      CARGO_HOME: D:\cargo-home
    steps:
      - uses: actions/checkout@v7
      - name: Pin Rust 1.99.1
        uses: ./.github/actions/hosted-rust
        with:
          toolchain: "1.99.1"
          cache-key: process-windows-dev
          sccache: "false"
          nextest: "true"
      - name: Run the Windows containment and row tests
        # The `dev` profile: the `test` one builds every dependency at opt-level 3.
        # Stops before the job limit so the cache is saved.
        timeout-minutes: 4
        run: cargo nextest run --locked -p lgwks_bot --no-default-features --features 'process,script,ephemeral' --test process_job --test it --cargo-profile dev --profile ci --no-fail-fast -E 'binary(process_job) | test(/_t[0-9]{2}$/)'
      - name: Upload the Windows JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-junit-windows
          path: target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 7

  # The repository's ruleset requires a check named exactly "Clippy and scan".
  # The lint job is a matrix whose legs report under their own names; this row
  # carries the required name, and `needs.clippy.result` is `success` only when
  # every leg succeeded.
  clippy_verdict:
    name: Clippy and scan
    needs: clippy
    if: ${{ always() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Every clippy leg passed
        env:
          LEGS: ${{ needs.clippy.result }}
        run: |
          echo "clippy and scan legs: ${LEGS}"
          test "${LEGS}" = success || test "${LEGS}" = skipped

  # The repository's ruleset requires a check named exactly "Build and workspace
  # tests". This row carries it and passes only when the archives, every shard
  # on both platforms (the saturation shard included), the evidence job and the
  # no-default suite passed, so no test is left out of the required check; a
  # cancelled or skipped job is not `success`, so it fails the row too.
  #
  # The row also holds the run's wall. The Director, 2026-10-26: "U WILL ADD A
  # GLOBAL RULE OF CI FAILING IF OVER 5 MINUTES. AND I DO NOT CARE WHAT FUCKING
  # EXCUSE THERE IS". GitHub has no run-level timeout and no context holds a
  # run's duration, so this job needs every other job, reads the attempt's own
  # start from the runs API, and fails past 300 s.
  #
  # The acceptance receipt is recorded here, from the JUnit reports the test
  # jobs already wrote, with the receipts binary the evidence job built.
  build_verdict:
    name: Build and workspace tests
    needs: [workspace_all_targets, workspace_build, tests_linux, tests_macos, workspace_tail, gate, advisories, simulation_evidence, debug_e2e, tests_std_full, tests_nodefault, clippy, docs, storefront-matrix, target-matrix, timing_gates, timing_async, feature-matrix-bot-ast, appcui-native, appcui-native-hosted, gpui-windows, process-windows, clippy_verdict, miri_unsafe]
    if: ${{ always() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    env:
      REVISION: ${{ github.sha }}
    steps:
      - name: Every workspace test job passed
        env:
          # The compile beyond the shards: the all-targets build and the
          # simulation listing.
          BUILD: ${{ needs.workspace_all_targets.result == 'success' && needs.workspace_build.result == 'success' && 'success' || 'failure' }}
          TAIL: ${{ needs.workspace_tail.result }}
          LINUX: ${{ needs.tests_linux.result }}
          MACOS: ${{ needs.tests_macos.result }}
          BOT_NODEFAULT: ${{ needs.tests_nodefault.result }}
        run: |
          echo "builds ${BUILD}, evidence ${TAIL}, Linux shards ${LINUX}, macOS shards ${MACOS}, lgwks_bot no default ${BOT_NODEFAULT}"
          test "${BUILD}" = success && test "${TAIL}" = success && test "${LINUX}" = success && test "${MACOS}" = success && test "${BOT_NODEFAULT}" = success
      - uses: actions/checkout@v7
      - name: Install sqlite3, the program the receipts are recorded through
        run: command -v sqlite3 || { sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3; }
      - name: Download the acceptance-receipts binary
        uses: actions/download-artifact@v8
        with:
          name: receipts-tool
          path: receipts-tool
      - name: Download lgwks-bot JUnit reports
        uses: actions/download-artifact@v8
        with:
          pattern: lgwks-bot-junit-*
          path: acceptance-artifact
      - name: Download the Linux and Windows JUnit reports
        uses: actions/download-artifact@v8
        with:
          pattern: acceptance-junit-*
          path: acceptance-junit
      - name: Record acceptance receipts
        run: chmod +x receipts-tool/acceptance-receipts && receipts-tool/acceptance-receipts --from-junit acceptance-artifact/*/junit.xml --db acceptance-artifact/receipts.sqlite --export acceptance-artifact/acceptance-receipts.json --revision "$REVISION" --platform darwin-arm64 && receipts-tool/acceptance-receipts --from-junit acceptance-junit/acceptance-junit-linux-*/junit.xml --db acceptance-artifact/receipts.sqlite --export acceptance-artifact/acceptance-receipts-linux.json --revision "$REVISION" --platform linux-aarch64 && receipts-tool/acceptance-receipts --map docs/acceptance/t-rows-windows.toml --features process,script,ephemeral --from-junit acceptance-junit/acceptance-junit-windows/junit.xml --db acceptance-artifact/receipts.sqlite --export acceptance-artifact/acceptance-receipts-windows.json --revision "$REVISION" --platform windows-x86_64
      - name: Upload acceptance receipt
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-receipts
          path: acceptance-artifact/
          retention-days: 30
      - name: Cache usage stays inside the repository's 10 GiB
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/cache/usage" --jq '"cache: \(.active_caches_count) entries, \(.active_caches_size_in_bytes / 1048576 | floor) MiB of 10240"'
      - name: Run wall is at most 300 seconds
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" --jq .run_started_at) && epoch=$(date -u -d "$started" +%s 2>/dev/null || date -j -u -f %Y-%m-%dT%H:%M:%SZ "$started" +%s) && wall=$(( $(date -u +%s) - epoch )) && echo "run wall ${wall} s since ${started}, limit 300 s" && test "$wall" -le 300

  # INV-STD-UNSAFE-1: the Miri proof, on every change. The two `unsafe` modules
  # carry a function-pointer seam each so the interpreter can drive the exact
  # call sites. Both seams are cross-interpreted by name; the job runs on macOS
  # so the darwin seam is interpreted on the platform it models. The step
  # carries the lane's command text verbatim, so `check-gate-parity` compares
  # them; each target's sysroot is built first with warnings allowed, because
  # it is the toolchain's own `sysroot` package (run 40719181967).
  miri_unsafe:
    name: Miri unsafe seams
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install lld, the linker the repository's cargo configuration names
        run: brew install lld
      - name: Prove the process unsafe seams under Miri
        run: |
          rustup toolchain install nightly-2026-10-01 --profile minimal --component miri --component rust-src && \
          CARGO_BUILD_WARNINGS=warn CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER="" cargo +nightly-2026-10-01 miri setup --target aarch64-apple-darwin && \
          CARGO_BUILD_WARNINGS=warn CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER="" cargo +nightly-2026-10-01 miri setup --target x86_64-pc-windows-msvc && \
          CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER="" MIRIFLAGS=-Zmiri-strict-provenance cargo +nightly-2026-10-01 miri test -p lgwks_std --no-default-features --features process --locked --lib --target aarch64-apple-darwin process::darwin::tests && \
          CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER="" MIRIFLAGS=-Zmiri-strict-provenance cargo +nightly-2026-10-01 miri test -p lgwks_std --no-default-features --features process --locked --lib --target x86_64-pc-windows-msvc process::windows::tests



