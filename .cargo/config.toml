# Make a plain `cargo build` the enforcement, not a separate CI step.
#
# This is not a trick: `cargo clippy` is literally
# `cmd.env("RUSTC_WORKSPACE_WRAPPER", clippy_path)` — see clippy's own main.rs.
# Setting it here means the lints in Cargo.toml `[workspace.lints]` fire on
# every ordinary build, for workspace members only (`--cap-lints` still
# protects the vendored tree), with no flag to remember and no CI step to skip.
#
# The wrapper composes with RUSTC_WRAPPER (sccache) in the order
# `$RUSTC_WRAPPER $RUSTC_WORKSPACE_WRAPPER $RUSTC`.
[build]
rustc-workspace-wrapper = "clippy-driver"

# A cargo config beats the manifest, and a developer's home config may set
# `[profile.dev] incremental = true` and `debug = 1`. Both would replace the
# profile Cargo.toml declares, and `test` inherits from `dev`. sccache refuses
# every incremental compile, so each gate lane, mutation copy and test build
# compiled the workspace crates again in its own target directory. Measured
# 2026-11-11: 33,032 of 142,357 calls were "non-cacheable: incremental", a
# 33.66 % hit rate, and `target/debug/incremental` held 12 GB. This repository's
# value wins over the home one, so the manifest's profile is what builds.
[profile.dev]
incremental = false
debug = 0

# The candle upstream pin (contract/PATCHES.toml) is a git source. Cargo's
# built-in fetch ignores `url.*.insteadOf` auth, and a runner whose git config
# rewrites https://github.com/ to ssh failed with "no authentication methods
# succeeded"; the git CLI honours the user's own git config.
[net]
git-fetch-with-cli = true

# The LLVM linker, not Apple's ld: the link step is a large share of a
# from-scratch build and ld64.lld is several times faster than the default.
[target.aarch64-apple-darwin]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=/opt/homebrew/bin/ld64.lld"]
