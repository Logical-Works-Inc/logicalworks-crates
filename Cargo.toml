[workspace]
members = [
    "crates/lgwks-std",
    "crates/lgwks-bot",
    "crates/lgwks-ast",
    "crates/lgwks-deps",
    "crates/lgwks-macros",
    "crates/drishti",
]
resolver = "2"

# ─────────────────────────────────────────────────────────────────────────────
# logicalworks-crates workspace dependencies.
#
# Source of truth for `lgwks_std` (the core surface), `lgwks_bot`
# (capability-gated automation verbs and the async runner surface), `lgwks_ast`
# (the multi-language AST parser), and `lgwks_deps` (dependency
# admission, audit, freshness, and the third-party storefront). This repo is now
# the source of truth: versions bump here and the tagged commit publishes to
# crates.io.
# ─────────────────────────────────────────────────────────────────────────────
[workspace.dependencies]
lgwks_std = { version = "4.1.0", path = "crates/lgwks-std" }
# Drishti's command orchestrates through `script!`; members opt into features.
lgwks_bot = { version = "8.1.0", path = "crates/lgwks-bot", default-features = false }
lgwks_ast = { version = "6.0.0", path = "crates/lgwks-ast" }
lgwks_macros = { version = "2.1.0", path = "crates/lgwks-macros" }
# The storefront has no default feature; dependents opt into storefront features
# such as `tokio` explicitly.
lgwks_deps = { version = "6.2.0", path = "crates/lgwks-deps", default-features = false }

[profile.release]
opt-level = 3
lto = true

# Debuginfo is the single largest cost of a from-scratch build and nothing in
# the workspace reads it (no debugger, no backtrace consumer beyond the file and
# line, which the panic message carries). `debug = 0` and a wide codegen split
# keep a full rebuild inside the budget; `debug-assertions` and `overflow-checks`
# are separate settings and stay on, so every assertion and trap still fires.
[profile.dev]
debug = 0
codegen-units = 256

# Tests run optimized. The simulation suites are CPU-bound, and at opt-level 0
# `sim_scale` on 4 threads took 39.9 s (114 s CPU) against 12.1 s (19.5 s CPU)
# at opt-level 1, for 7.6 s more compile (measured 2026-09-30). Opt-level 2
# halved the heaviest sims again (the 5,000-tenant provision sim 67.9 s to
# 34.3 s), and opt-level 3 nearly halves them once more (34.3 s to 21.5 s, the
# tenant replay family with it), at the same seeds and assertions (measured
# 2026-10-07). Compile speed stopped being the binding constraint once every
# CI instance kept a warm target directory (a warm rebuild after touching every
# source is seconds); suite wall time is, so the profile spends compile to buy
# it. `debug-assertions` and `overflow-checks` are separate settings and stay
# on, so every assertion and overflow trap still fires. `build`, `check` and
# `clippy` use `dev` and are unchanged.
#
# CI is held to 5 minutes a run (Director, 2026-10-13), and on a hosted runner the
# opt-level-3 compile of `lgwks_bot`'s test binaries alone outlasts that (run
# 38395269833: the saturation job was cancelled at 4 m 14 s inside that
# compile). So the test profile is opt-level 1: the same assertions and
# overflow checks, a fraction of the codegen. Dependencies keep opt-level 3 in
# the cache, so they are paid for once.
[profile.test]
opt-level = 1
# No debuginfo: a panic still names its file and line, which the message
# carries. CI's bot shards compile and link test binaries cold in every job
# (#272; run 41702461553: one Linux shard compiled 179 s and ended at 305 s),
# and debuginfo is what rustc emits and the linker copies beyond the code.
# Nothing in the workspace reads it. CI repeats the value as
# `CARGO_PROFILE_TEST_DEBUG` so its cache keys on it.
debug = 0

[profile.test.package."*"]
opt-level = 3

# The macOS test shards only (province#9). Test binaries link, so sccache
# cannot hold them, and on the 3-vCPU hosted runner a cold shard was still
# compiling at the 5-minute limit with dependencies at opt-level 3 (run
# 41698583571: every bot and workspace-core shard cancelled at 320 to 328 s).
# Here dependencies build at opt-level 1 and workspace crates at 0, lgwks_bot
# at 1 (below). A named profile, not an environment override, because sccache
# hashes `CARGO_*` variables. Assertions and overflow checks stay on; the
# simulations run slower and the shards are cut finer for it.
[profile.ci-it]
inherits = "test"
opt-level = 0

[profile.ci-it.package."*"]
opt-level = 1

# Shared lint contract: every member opts in with `[lints] workspace = true`.
# Mirrors the crate-level attributes the crates already carried, plus
# `broken_intra_doc_links`, which CI enforces on the docs lanes.
[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
# Rustc-owned lints the anti-pattern corpus names. They are NOT clippy lints:
# naming them under [lints.clippy] is a silent no-op (verified, E0602).
unused_must_use = "forbid"
improper_ctypes = "forbid"
improper_ctypes_definitions = "forbid"
# `lwc_it_group` selects one group of lgwks_bot's `it` test modules for a CI job.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(lwc_it_group, values(none(), "scale", "surface", "refusals", "g1", "g2", "g3", "g4", "g5", "g6", "g7", "g8"))'] }

# ─────────────────────────────────────────────────────────────────────────────
# Anti-pattern contract.
#
# Every lint below is `forbid`, not `deny`. A `deny` is defeated by any single
# `#[allow]` anywhere in the crate, including one smuggled in by a macro this
# workspace does not own (verified: a macro-internal allow silenced a crate-level
# deny with zero diagnostics). `forbid` cannot be lowered from source; a
# conflicting allow is a hard E0453. That property is the entire reason this
# file can be binding without a human in the loop.
#
# Sourced from the rust anti-pattern corpus (75 entries, 13 Critical) plus
# https://github.com/rust-unofficial/patterns.
#
# Four names in the corpus do not work as written and are corrected here:
#   clippy::unwrap_or_else_default     -> renamed; use unwrap_or_default
#   clippy::improper_ctypes            -> rustc lint, moved to [lints.rust]
#   clippy::improper_ctypes_definitions-> rustc lint, moved to [lints.rust]
#   (similarly, an unknown name in this table is a SILENT no-op, so every
#    addition must be validated against a deliberately-fake control lint)
# ─────────────────────────────────────────────────────────────────────────────
[workspace.lints.clippy]
allow_attributes = "forbid"
allow_attributes_without_reason = "forbid"
arithmetic_side_effects = "forbid"
as_conversions = "forbid"
assigning_clones = "forbid"
await_holding_lock = "forbid"
await_holding_refcell_ref = "forbid"
borrow_as_ptr = "forbid"
cast_possible_truncation = "forbid"
cast_precision_loss = "forbid"
cast_sign_loss = "forbid"
clone_on_ref_ptr = "forbid"
dbg_macro = "forbid"
empty_drop = "forbid"
exhaustive_enums = "forbid"
exhaustive_structs = "forbid"
exit = "forbid"
expect_fun_call = "forbid"
expect_used = "forbid"
explicit_deref_methods = "forbid"
float_cmp = "forbid"
fn_params_excessive_bools = "forbid"
format_push_string = "forbid"
implicit_clone = "forbid"
integer_division = "forbid"
iter_over_hash_type = "forbid"
large_stack_arrays = "forbid"
let_underscore_future = "forbid"
let_underscore_must_use = "forbid"
lossy_float_literal = "forbid"
manual_contains = "forbid"
map_entry = "forbid"
mem_forget = "forbid"
mem_replace_with_default = "forbid"
min_ident_chars = "forbid"
missing_assert_message = "forbid"
missing_docs_in_private_items = "forbid"
missing_safety_doc = "forbid"
modulo_arithmetic = "forbid"
multiple_unsafe_ops_per_block = "forbid"
must_use_candidate = "forbid"
needless_collect = "forbid"
needless_lifetimes = "forbid"
needless_range_loop = "forbid"
panic = "forbid"
panicking_unwrap = "forbid"
pattern_type_mismatch = "forbid"
print_stderr = "forbid"
print_stdout = "forbid"
ptr_arg = "forbid"
rc_buffer = "forbid"
redundant_clone = "forbid"
ref_option_ref = "forbid"
slow_vector_initialization = "forbid"
str_to_string = "forbid"
string_add = "forbid"
todo = "forbid"
transmute_ptr_to_ref = "forbid"
unchecked_time_subtraction = "forbid"
undocumented_unsafe_blocks = "forbid"
unimplemented = "forbid"
unused_io_amount = "forbid"
unwrap_in_result = "forbid"
unwrap_or_default = "forbid"
unwrap_used = "forbid"
wildcard_imports = "forbid"

# ─────────────────────────────────────────────────────────────────────────────
# API bans — the two `deny` entries, and why they differ.
#
# `clippy.toml` states WHICH APIs are banned. These two names are what make a
# violation fatal; without them the entire ban list is inert, because
# `disallowed_methods` and `disallowed_types` are warn-by-default. That second
# half was missing until 2026-09-20, and the ban list had never once failed a
# build. Verified by applying `-D` by hand across the workspace, which
# immediately surfaced 10 violations that CI had been passing.
#
# These are `deny` rather than `forbid` for a reason the `forbid` rule above
# does not cover. Every other entry here is an anti-pattern with no legitimate
# use anywhere, so an exception could only ever be a mistake. These are API
# bans whose exceptions are real, narrow, and test-scoped: `lgwks_std::task` is
# a thread-parking executor, so a test of it must spawn a thread and must sleep,
# and `forbid` would make those tests unwritable rather than correct. The
# escape is a reasoned `#[expect]` at the test module, which
# `allow_attributes_without_reason = "forbid"` above already forces to carry a
# justification. That lint is in fact the tell: it exists so exceptions can be
# audited, and it would be dead config if every lint were `forbid`.
disallowed_methods = "deny"
disallowed_types = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

# lgwks_bot keeps the test profile's opt-level 1 inside `ci-it` (the profile is
# defined with the others above; this sits last so the lint lines the guides
# cite do not move). Its stack-bound regression,
# sim_clock_wiring::a_deep_nest_of_clock_governed_steps_is_stack_bounded, is
# calibrated at opt-level 1 (1,024 levels on 1,536 KiB overflow only with the
# `select!` arms unboxed); at opt-level 0 it overflowed either way on macOS (run
# 41664993612), so the test no longer discriminated.
[profile.ci-it.package.lgwks_bot]
opt-level = 1

# The Linux lgwks_bot shards and the macOS saturation rows: `ci-it` with
# dependencies at opt-level 0. A macOS saturation tenth built for 4 m 20 s
# under `ci-it` and ran its tests in seconds (96086198a).
# Cold, a bot-it shard spent 248 to 259 s building with dependencies at
# opt-level 1 and was cancelled at the limit with its tests barely started
# (run 41713569268). lgwks_bot keeps opt-level 1 for the stack-bound test above.
[profile.ci-bot]
inherits = "ci-it"

[profile.ci-bot.package."*"]
opt-level = 0

[profile.ci-bot.package.lgwks_bot]
opt-level = 1
