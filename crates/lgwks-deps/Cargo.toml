[package]
name = "lgwks_deps"
description = "Dependency admission, supply-chain policy, and debugger-doctor CLI for a Rust workspace: every external edge and default trace install is verified."
version = "6.2.1"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/Logical-Works-Inc/logicalworks-crates"
documentation = "https://docs.rs/lgwks_deps"
readme = "README.md"
homepage = "https://github.com/Logical-Works-Inc/logicalworks-crates/tree/main/crates/lgwks-deps"
categories = ["development-tools", "config"]
keywords = ["dependencies", "audit", "supply-chain", "cargo", "debug"]
# The documentation spells its commands `cargo run -p lgwks_deps -- check .`
# (AGENTS.md, CONTRIBUTING.md, the dependency doctrine). With several binaries
# cargo refuses a bare `cargo run`, so the one those pages mean is named here;
# tests/it/default_run.rs holds the key to that promise.
default-run = "lgwks-deps"

# This crate consumes JSON only through the facade it enforces.
# Depending on serde_json directly here would make the checker its own first
# bypass.
#
# The zero-gate source scan (INV-SCAN-ZERO) was once a default feature here and
# held `syn`. It now lives in `lgwks_ast` (feature `scan`),
# which reads Rust through its one tree-sitter parser (ADR 0002, #408), so this
# crate authors no Rust grammar at all.
[features]
# The default set is the doctor and the `lgwks` binary. Every other capability
# (the proc-macro stack, the `script!` token reader, the tokio storefront, the
# Bevy runtime set) is a named feature below. ADR 0003 is the decision.
#
# The storefront's default selection is empty, and that is a decision this
# register states rather than an omission: the target matrix builds this crate
# with no flags as a *required* claim for every declared target, `wasm32-wasip1`
# among them, and every storefront group is either native (`appcui`, `gpui`) or a
# driver with no wasm surface (`tokio-net`, `tokio-process`, `tokio-signal`). A
# default that cannot build on a declared target is not a default (ADR 0003).
#
# Discovery is what a storefront owes its user, and it is the catalog's job
# rather than a compile's: `lgwks-deps catalog` prints every group with its
# feature, its owner and its measured cost, so nothing here is hidden behind a
# flag an agent has to guess. Three groups are default-off with their measured
# cost in ADR 0003:
#
#   * `gpui` — Zed's GPU UI framework. macOS builds need an Xcode Metal toolchain
#     and Linux builds the platform development stack, so a default carrying it
#     would fail to build wherever those are absent.
#   * `ml-candle`, `ml-candle-metal`, `ml-tokenizers` — an ML inference runtime
#     and the HuggingFace tokenizer. Measured on this machine 2026-10-22:
#     `cargo check -p lgwks_deps --features ml-candle,ml-tokenizers` cost 90 s on
#     a warm target directory, against 35 s for `appcui`.
default = ["debug-doctor", "lgwks"]
# Proc-macro authoring storefront: token streams (`proc-macro2`) and
# quasi-quoting (`quote`) a first-party proc-macro crate needs. `lgwks_macros` is
# the one consumer; it reaches both through the re-exports below, so this crate
# stays the only author of each edge.
macro = ["dep:proc-macro2", "dep:quote"]
# The `lgwks expand` formatter (#787): pretty-printing the emitted Rust needs
# the tokens parsed (syn) and printed (prettyplease), neither of which the
# estate owns. One feature for the pair, default-on through `lgwks`, following
# the `macro` precedent (one feature, two edges).
prettyplease = ["dep:prettyplease", "dep:syn"]
# The `lgwks` binary (#787): the one script reader and emitter (`lgwks_ast`)
# plus the formatter `expand` prints through. Default-on; the binary requires
# it, so a `--no-default-features` library build stays zero-dependency.
lgwks = ["dep:lgwks_ast", "prettyplease"]
# The token stream the `script!` language is read from (`lgwks_ast`'s `script`
# feature, #383): `proc-macro2` with span locations and nothing else, so a tool
# that reads scripts, and the macro that compiles them, share one parser
# without either pulling `syn` or `quote` for it.
script = ["dep:proc-macro2"]
# Storefront features. `lgwks_deps` is the install-and-select surface:
# the end user enables the third-party capability they want. gpui is Zed's GPU
# desktop UI framework; `tokio` is the async engine behind `lgwks_bot`'s runner
# surface. None is in the default set; the `default` comment above says why, and
# `lgwks-deps catalog` lists each one.
gpui = ["dep:gpui", "gpui/default"]
appcui = ["dep:appcui"]
# Day-0 revenue slice (#721): HTTP routing, HTTP middleware and the AI input
# guard. Pure-Rust, permissive licences, default-off like every other
# storefront group; the TLS the HTTP stack needs terminates at the OS reverse
# proxy, so no TLS provider edge is admitted here (#728).
axum = ["dep:axum"]
tower-http = ["dep:tower-http"]
llm-guard = ["dep:llm-guard"]
# ML inference storefront. Candle is HuggingFace's minimalist Rust ML framework:
# `ml-candle` brings tensor compute, NN layers, and the transformer model
# registry; `ml-candle-metal` adds the macOS Metal backend to that set.
# `ml-tokenizers` is the HuggingFace subword tokenizer used for tokenizer
# parity with the reference runtime. The measured cost of selecting them is in
# the `default` comment above and ADR 0003.
ml-candle = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers"]
ml-candle-metal = ["ml-candle", "candle-transformers/metal"]
ml-tokenizers = ["dep:tokenizers"]
tokio = ["dep:tokio"]
tokio-time = ["tokio", "tokio/time"]
tokio-sync = ["tokio", "tokio/sync"]
tokio-macros = ["tokio", "tokio/macros"]
# The reader/writer traits and their extensions. Split out from `net` because a
# consumer can need `AsyncRead`/`AsyncWrite` over a pipe, a file, or its own
# transport without ever opening a socket — and until this existed, `io-util`
# was reachable only by enabling the whole networking stack to get it.
tokio-io = ["tokio", "tokio/io-util", "tokio/io-std"]
tokio-net = ["tokio-io", "tokio/net"]
tokio-process = ["tokio", "tokio/process"]
tokio-fs = ["tokio", "tokio/fs"]
tokio-signal = ["tokio", "tokio/signal"]
tokio-full = [
    "tokio-time",
    "tokio-sync",
    "tokio-macros",
    "tokio-io",
    "tokio-net",
    "tokio-process",
    "tokio-fs",
    "tokio-signal",
]
# ECS storefront. One state substrate serves three consumers: `lgwks_bot`'s
# four-verb actors, drishti's incremental derivation, and the GPU framework's
# demand-driven execution. `bevy-ecs` is the substrate; the other three are what
# turn it into a runtime rather than a data structure. All four are default-off,
# like every storefront group, and pull no renderer, no windowing, and no audio.
bevy-ecs = ["dep:bevy_ecs"]
bevy-app = ["bevy-ecs", "dep:bevy_app"]
bevy-time = ["bevy-ecs", "dep:bevy_time"]
bevy-state = ["bevy-ecs", "dep:bevy_state"]
# The debug doctor's own global subscriber. Default-on, like every capability
# this crate owns (#732), so `lgwks-deps debug` installs the debugger it
# reports on. A process-only `lgwks_bot` consumer still never carries
# `tracing-subscriber` (#687): every workspace edge to this crate is
# `default-features = false`, so the default reaches only a direct storefront
# install.
debug-doctor = ["lgwks_std/trace-install"]
# Interim zoned time (jiff): DST-aware calendar arithmetic and IANA zones
# until ELIMINATE lands in lgwks_std::time. Default-off; lgwks_std::time stays
# the UTC RFC 3339 core.
time-jiff = ["dep:jiff"]
# Durable state (SQLite). One pinned engine for every estate service that
# keeps state across runs, opened with the estate's defaults (WAL readers
# beside a writer, kernel-released locks, a busy timeout, `user_version`
# migrations) through `lgwks_deps::sqlite`. Default-off: the bundled C build
# is native-only and has no wasm surface, like every other storefront group
# (ADR 0003). Consumers opt in via --features sqlite and declare no SQLite
# crate of their own (#696, #700).
sqlite = ["dep:rusqlite"]
# Sealed records (AEAD). The one pinned authenticated-encryption engine the
# sealed journal and run-store records seal under: ChaCha20-Poly1305, pure
# Rust, no C toolchain, portable to every declared target. Default-off like
# every other storefront group (ADR 0003); `lgwks_bot` selects it through its
# `sealed` feature and reaches the engine only through the storefront (#785).
sealed-aead = ["dep:chacha20poly1305"]
# Agent standards (ADR 0015): the open protocols an agent harness speaks, so a
# consumer wires a standard instead of writing its boilerplate. Default-off like
# every storefront group (ADR 0003): each one carries the tokio network driver or
# ring, neither of which builds for `wasm32-wasip1`, and each cost is measured in
# contract/APPROVED.toml. `agent` selects all seven.
#
#   * `tls-ring` — one in-process TLS provider (rustls on ring, the provider the
#     sealed #728 exception already excuses) for every client below, installed
#     once by `lgwks_deps::tls::install_ring`. The `reqwest` edge exists only to
#     select `rustls-no-provider` for the clients that bring reqwest; it is not
#     re-exported, so `lgwks_std::http` stays the estate's HTTP client.
#   * `mcp` — the Model Context Protocol SDK (rmcp): server, client, stdio,
#     child-process and streamable-HTTP transports, OAuth. Its `macros` feature
#     is declined: the macros expand to `::rmcp::` paths a storefront consumer
#     cannot name (ADR 0015).
#   * `model` — one client for every model provider (genai).
#   * `json-schema` — JSON Schema 2020-12 validation of tool arguments.
#   * `oauth2` — the OAuth 2.1 authorization-code flow with PKCE.
#   * `cose` — COSE_Sign1 envelopes (RFC 9052), sealed with `lgwks_std::sign`.
#   * `merkle-log` — the RFC 6962 append-only log with inclusion and consistency
#     proofs, generic over its `digest` hasher (the journey uses lgwks_std's BLAKE3).
#   * `otel` — OpenTelemetry traces, metrics and logs with OTLP/HTTP export and
#     the bridge from `lgwks_std::trace` spans.
tls-ring = ["dep:rustls", "dep:reqwest"]
mcp = ["tls-ring", "tokio-io", "dep:rmcp"]
model = ["tls-ring", "dep:genai"]
json-schema = ["dep:jsonschema"]
oauth2 = ["dep:oauth2"]
cose = ["dep:coset"]
merkle-log = ["dep:ct-merkle"]
otel = [
    "tls-ring",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
]
agent = ["mcp", "model", "json-schema", "oauth2", "cose", "merkle-log", "otel"]

[dependencies]
# The foundation this gate is built on, named rather than inherited: `core` is
# the walk, clock and encoding it reads with, `trace` is how it logs a refusal,
# `json` is the register and report format, and `legacy` is the codec set
# `lgwks legacy` reads and writes (pure Rust, no edge of its own).
# `default-features = false`
# because a *tool's* edge declares the capabilities it uses; the storefront's
# own default set is what it sells to a consumer, and that is argued in the
# `[features]` block above. Keeping the edge exact also keeps the four
# storefront fixtures' lockfiles independent of `lgwks_std`'s default set.
lgwks_std = { workspace = true, default-features = false, features = ["core", "trace", "json", "legacy"] }
proc-macro2 = { version = "1", features = ["span-locations"], optional = true }
quote = { version = "1", optional = true }
# Day-0 revenue slice (#721): each edge is registered in contract/APPROVED.toml
# with owner lgwks_deps, a replacement and a removal trigger. axum carries the
# serving stack the slice proves (http1, tokio, json, tracing); tower-http the
# middleware layers named in the issue; llm-guard the fuzzy scanner only, with
# no model download. All default-features off.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "tracing"], optional = true }
tower-http = { version = "0.7", default-features = false, features = ["cors", "trace", "compression-gzip", "compression-deflate"], optional = true }
llm-guard = { version = "0.2", default-features = false, features = ["fuzzy"], optional = true }
gpui = { version = "0.2", optional = true }
appcui = { version = "=0.5.5", default-features = false, optional = true }
# Bevy's ECS and the three crates that make it a runtime. `default-features =
# false` throughout, and two omissions are deliberate: `bevy_reflect` stays off
# (it is the expensive half of `bevy_ecs`'s default set and this workspace does not
# need runtime type reflection), and `multi_threaded` stays off, because the
# multithreaded executor admits any system whose access set is disjoint from the
# running set, so the order of two non-conflicting systems is not fixed. A bot
# polling sources does not need parallel scheduling and cannot afford that.
bevy_ecs = { version = "0.20", default-features = false, features = ["std"], optional = true }
bevy_app = { version = "0.20", default-features = false, optional = true }
bevy_time = { version = "0.20", default-features = false, optional = true }
bevy_state = { version = "0.20", default-features = false, optional = true }
# The engine is compiled `default-features = false` with the portable `rt`
# feature always on. Native targets add `rt-multi-thread`; WASM targets use the
# current-thread runtime because Tokio does not provide its multi-thread driver
# there. Every other driver is a storefront feature the consumer selects.
tokio = { version = "1", default-features = false, features = ["rt"], optional = true }
# Candle and the HuggingFace tokenizer are storefront edges: optional and
# default-off, so `cargo build`/`cargo install` pulls none of them. Model
# weights load from local files; `candle-transformers` itself pulls `hf-hub`,
# so selecting `ml-candle` does compile a network-capable closure even though
# the runtime reads a local checkpoint.
#
# Upstream pin (contract/PATCHES.toml): candle 0.11.0 on crates.io requires
# zip ^8.6, covered by RUSTSEC-2026-0367..0369 and GHSA-m665-v7pm-7grj.
# huggingface/candle#4078 moved it to zip 9.1.3; the workspace builds that
# merge commit until 0.11.1 publishes. `cargo publish` drops `git` and keeps
# `version`, so the published crate still names the registry release.
candle-core = { version = "0.11", git = "https://github.com/huggingface/candle", rev = "9515d410e3af803fd45efebfef8137f47d85a63d", optional = true }
candle-nn = { version = "0.11", git = "https://github.com/huggingface/candle", rev = "9515d410e3af803fd45efebfef8137f47d85a63d", optional = true }
candle-transformers = { version = "0.11", git = "https://github.com/huggingface/candle", rev = "9515d410e3af803fd45efebfef8137f47d85a63d", default-features = false, optional = true }
tokenizers = { version = "0.23", optional = true }
# Interim zoned time: jiff with system zoneinfo plus bundled fallback, no
# default features so the no-flag build stays portable. Consumers opt in via
# --features time-jiff and reach it only through lgwks_deps::storefront::jiff.
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo", "tzdb-concatenated"], optional = true }
# Durable state: the one SQLite every estate service opens. Pinned exactly
# (estate issues #696, #700), bundled so no system library is needed, and no
# default features so the no-flag build stays portable: the engine is
# selected, never the crate.
rusqlite = { version = "=0.41.0", default-features = false, features = ["bundled"], optional = true }
# Sealed records: the one AEAD every sealed estate record seals under.
# Pinned exactly (estate issue #785). ChaCha20-Poly1305 is pure Rust with no
# C toolchain, so the no-flag build stays portable: the engine is selected,
# never the crate.
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"], optional = true }
# Formatted-Rust printing for `lgwks expand` (#787): the minimal syn parser and
# the minimal pretty printer. Both are pure Rust with no C toolchain, so the
# no-flag build stays portable: the engines are selected, never the crates.
prettyplease = { version = "=0.2.37", default-features = false, optional = true }
syn = { version = "=2.0.119", default-features = false, features = ["full", "parsing", "printing"], optional = true }
# The one script reader and emitter (#787): `lgwks_ast` with the `emit`,
# `legacy` and `hunks` features. A workspace member, so it needs no register
# entry; default features off so no tree-sitter grammar rides along, only the
# token reader, the one emitter, the COBOL and JCL reader, and the diff reader
# `check-docs --base` judges a change's added lines with.
lgwks_ast = { workspace = true, default-features = false, features = ["emit", "legacy", "hunks"], optional = true }
# Agent standards (ADR 0015). Every edge pinned exactly, default features off,
# and one TLS provider for the lot: rustls on ring with `rustls-no-provider`
# reqwest, so no aws-lc-sys, cmake or OpenSSL enters the tree.
rustls = { version = "=0.23.46", default-features = false, features = ["std", "tls12", "ring"], optional = true }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"], optional = true }
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "client", "transport-io", "transport-child-process", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider", "auth"], optional = true }
genai = { version = "=0.7.3", default-features = false, optional = true }
jsonschema = { version = "=0.60.2", default-features = false, optional = true }
oauth2 = { version = "=5.0.0", default-features = false, optional = true }
coset = { version = "=0.4.2", default-features = false, optional = true }
ct-merkle = { version = "=0.3.0", default-features = false, optional = true }
opentelemetry = { version = "=0.33.1", default-features = false, features = ["trace", "metrics", "logs"], optional = true }
opentelemetry_sdk = { version = "=0.33.1", default-features = false, features = ["trace", "metrics", "logs", "rt-tokio"], optional = true }
opentelemetry-otlp = { version = "=0.33.1", default-features = false, features = ["http-proto", "trace", "metrics", "logs", "reqwest-client"], optional = true }
tracing-opentelemetry = { version = "=0.34.0", default-features = false, optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"], optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread"], optional = true }
# Capture-file distinguishers need OS entropy, and the estate has exactly one
# source: `lgwks_std::random` (INV-RANDOM-ONE-SOURCE). That module refuses wasm
# with a `compile_error!`, and the WASI boundary job builds this crate for
# `wasm32-wasip1`, so the feature rides the same host-only target gate as
# tokio above rather than the unconditional edge: the wasm build names its
# capture files from a clock and a sequence under exclusive creation instead.
# This adds no edge of its own — a feature of a dependency already held —
# which keeps the tree at one entropy source rather than two.
lgwks_std = { workspace = true, default-features = false, features = ["random"] }

[[bin]]
name = "lgwks-deps"
path = "src/main.rs"

# One-file apps and the Rust they compile to (#787): `lgwks new | run |
# expand | check`. The storefront users install, so `cargo install lgwks_deps`
# gives `lgwks`. Subcommands live in `src/bin/lgwks/`.
[[bin]]
name = "lgwks"
path = "src/bin/lgwks/main.rs"
required-features = ["lgwks"]

[[bin]]
name = "llms-txt"
path = "src/bin/llms_txt.rs"

# The project page, written to a build directory and deployed by the Pages
# workflow: the repository holds Rust, so the page is generated, never checked
# in, and cannot drift from the crate list (`every_crate_directory_is_on_the_page`).
[[bin]]
name = "render-site"
path = "src/bin/render_site.rs"

[[bin]]
name = "check-requirements"
path = "src/bin/check_requirements.rs"

# The capability catalog (#732): the discovery half of the std-first gate. It
# prints the register, emits it as JSON for an agent, writes the generated page
# and refuses a register that disagrees with the tree.
[[bin]]
name = "catalog"
path = "src/bin/catalog/main.rs"

# The dependency mortgage report (#722): every edge's replacement, removal
# trigger and last review, every deferral's trigger, every pin's expiry and
# every blocked provider's cover, as text or JSON.
[[bin]]
name = "ledger"
path = "src/bin/ledger.rs"

# The documentation-governance reader: every ADR against ISO/IEC/IEEE 42010 and
# every PRD requirement against ISO/IEC/IEEE 29148. `--base` reads the lines a
# change added through `lgwks_ast::hunks`, the one diff reader, which the
# default `lgwks` feature carries.
[[bin]]
name = "check-docs"
path = "src/bin/check_docs/main.rs"
required-features = ["lgwks"]

# The declared target matrix, executed: the required Rust-only surface on every
# target, and each crate's default set recorded with its declared C-toolchain
# exemption. It replaced a shell script on 2026-10-22, when `hash` joined the
# default set and the required check had to name a set with no C in it.
[[bin]]
name = "check-target-matrix"
path = "src/bin/check_target_matrix.rs"

[[bin]]
name = "check-spec-owners"
path = "src/bin/check_spec_owners.rs"

[[bin]]
name = "check-doc-citations"
path = "src/bin/check_doc_citations/main.rs"

[[bin]]
name = "check-gate-parity"
path = "src/bin/check_gate_parity/main.rs"

[[bin]]
name = "check-std-first"
path = "src/bin/check_std_first/main.rs"

[[bin]]
name = "ci-local"
path = "src/bin/ci_local/main.rs"

[[bin]]
name = "acceptance-receipts"
path = "src/bin/acceptance_receipts/main.rs"

[[bin]]
name = "linux-container-tests"
path = "src/bin/linux_container_tests/main.rs"

# The downstream proof of a release (#155, #526): every published crate built
# from crates.io at its newest tag, with the README's own quickstart.
[[bin]]
name = "published-consumer"
path = "src/bin/published_consumer/main.rs"

[[bin]]
name = "ai-authoring"
path = "src/bin/ai_authoring/main.rs"

# The nextest wrapper that holds one of a few machine-wide slots while a test
# process runs (#272); `.config/nextest.toml` names it.
[[bin]]
name = "churn-slot"
path = "src/bin/churn_slot.rs"

[lib]
name = "lgwks_deps"
path = "src/lib.rs"

[dev-dependencies]
proptest = { version = "1.11", default-features = false, features = ["std"] }
# The retire simulation hashes its verdicts through the estate primitive
# (#788): test-only, so the `hash` backend never enters the shipped closure.
lgwks_std = { workspace = true, default-features = false, features = ["core", "trace", "json", "hash"] }

[lints]
workspace = true

[package.metadata.docs.rs]
# Not `all-features`. docs.rs builds for x86_64-unknown-linux-gnu, and two
# storefront features are platform-bound: `gpui` pulls `objc2`, which refuses to
# compile off Apple targets, and `ml-candle-metal` selects Candle's Metal
# backend. With `all-features = true` every published version failed to build,
# so this crate had no rendered documentation at all. This list is the set the
# CI doc and clippy lanes already verify on Linux; the platform-bound features
# are covered by the per-platform jobs instead.
features = [
    "tokio-full",
    "appcui",
    "bevy-app",
    "bevy-time",
    "bevy-state",
]
rustdoc-args = ["--cfg", "docsrs"]
