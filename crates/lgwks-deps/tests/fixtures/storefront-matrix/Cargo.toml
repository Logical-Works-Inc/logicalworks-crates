[package]
name = "storefront-matrix-consumer"
version = "0.1.0"
edition = "2024"

[workspace]

[features]
default = ["appcui"]
appcui = ["lgwks_deps/appcui"]
axum = ["lgwks_deps/axum"]
tower-http = ["lgwks_deps/tower-http"]
llm-guard = ["lgwks_deps/llm-guard"]
bevy-ecs = ["lgwks_deps/bevy-ecs"]
gpui = ["lgwks_deps/gpui"]
ml-candle = ["lgwks_deps/ml-candle"]
ml-candle-metal = ["lgwks_deps/ml-candle-metal"]
ml-tokenizers = ["lgwks_deps/ml-tokenizers"]
sqlite = ["lgwks_deps/sqlite"]
all-storefront = [
    "appcui",
    "axum",
    "tower-http",
    "llm-guard",
    "bevy-ecs",
    "gpui",
    "ml-candle",
    "ml-candle-metal",
    "ml-tokenizers",
    "sqlite",
    "tokio-base",
    "tokio-time",
    "tokio-sync",
    "tokio-macros",
    "tokio-io",
    "tokio-net",
    "tokio-process",
    "tokio-fs",
    "tokio-signal",
    "tokio-full",
]
tokio-base = ["lgwks_deps/tokio"]
tokio-time = ["lgwks_deps/tokio-time"]
tokio-sync = ["lgwks_deps/tokio-sync"]
tokio-macros = ["lgwks_deps/tokio-macros"]
tokio-io = ["lgwks_deps/tokio-io"]
tokio-net = ["lgwks_deps/tokio-net"]
tokio-process = ["lgwks_deps/tokio-process"]
tokio-fs = ["lgwks_deps/tokio-fs"]
tokio-signal = ["lgwks_deps/tokio-signal"]
tokio-full = ["lgwks_deps/tokio-full"]
# Agent standards (ADR 0015). Each journey composes the estate owner it stands
# on: lgwks_bot's runtime drives every future, lgwks_std::json builds every
# schema, lgwks_std::sign seals COSE, lgwks_std::trace emits the bridged span and
# lgwks_std::seeded drives each journey's `sim` mode.
mcp = ["lgwks_deps/mcp", "dep:lgwks_bot", "dep:lgwks_std"]
model = ["lgwks_deps/model", "dep:lgwks_bot", "dep:lgwks_std"]
json-schema = ["lgwks_deps/json-schema", "dep:lgwks_std"]
oauth2 = ["lgwks_deps/oauth2"]
cose = ["lgwks_deps/cose", "dep:lgwks_std", "lgwks_std/sign"]
merkle-log = ["lgwks_deps/merkle-log", "dep:lgwks_std", "lgwks_std/hash"]
otel = ["lgwks_deps/otel", "dep:lgwks_bot", "dep:lgwks_std"]
script-json-schema = ["json-schema", "dep:lgwks_bot", "lgwks_bot/script"]

[dependencies]
lgwks_deps = { path = "../../..", default-features = false }
lgwks_std = { path = "../../../../lgwks-std", default-features = false, features = ["core", "json", "trace"], optional = true }
lgwks_bot = { path = "../../../../lgwks-bot", default-features = false, features = ["rt", "io", "macros"], optional = true }

